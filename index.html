<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Anand Chess Club</title>
<!-- Cross-origin isolation shim: GitHub Pages can't send COOP/COEP headers, and
     Stockfish needs them for WASM threads. Reloads the page once on first visit. -->
<script src="coi-serviceworker.js"></script>
<style>
  :root { --brass: #C08A3E; }
  body[data-theme="slate"] {
    --bg:#14171C; --dark:#55606E; --light:#D8CEBD;
    --pw:#F0E9DC; --pb:#262B33; --pb-line:rgba(255,255,255,.20);
  }
  body[data-theme="dusk"] {
    --bg:#1C212A; --dark:#5A6472; --light:#AFAA9C;
    --pw:#D6D2C8; --pb:#272C35; --pb-line:rgba(255,255,255,.18);
  }
  body[data-theme="night"] {
    --bg:#08090B; --dark:#000000; --light:#474C53;
    --pw:#B2AEA6; --pb:#2E3238; --pb-line:rgba(178,174,166,.75);
  }
  body[data-theme="sage"] {
    --bg:#1E241F; --dark:#5B6A5C; --light:#AFB39F;
    --pw:#D5D6C7; --pb:#29312A; --pb-line:rgba(255,255,255,.18);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; }
  body {
    background: var(--bg);
    color: var(--pw);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  .hidden { display: none !important; }
  button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }

  /* ---------- Ladder screen ---------- */
  #ladder { max-width: 520px; margin: 0 auto; padding: 16px 16px 40px; }
  .themes { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; }
  .chip {
    padding: 5px 12px; border-radius: 999px; font-size: 13px;
    border: 1px solid color-mix(in srgb, var(--pw) 25%, transparent);
    color: color-mix(in srgb, var(--pw) 70%, transparent);
  }
  .chip.on { border-color: var(--brass); color: var(--brass); }
  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 26px; text-align: center; margin: 0 0 4px; letter-spacing: .02em;
  }
  .sub {
    text-align: center; margin: 0 0 22px; font-size: 14px; font-style: italic;
    color: color-mix(in srgb, var(--pw) 60%, transparent);
  }
  .row {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 12px 14px; margin-bottom: 8px; border-radius: 10px; text-align: left;
    border: 1.5px solid color-mix(in srgb, var(--pw) 12%, transparent);
    background: color-mix(in srgb, var(--pw) 4%, transparent);
  }
  .row .nm { flex: 1; font-size: 16px; }
  .row .rt { font-size: 13px; color: color-mix(in srgb, var(--pw) 55%, transparent); font-variant-numeric: tabular-nums; }
  .row .st { font-size: 13px; }
  .row.beaten { opacity: .45; }
  .row.beaten .st { color: var(--brass); }
  .row.current { border-color: var(--brass); }
  .row.locked { opacity: .28; cursor: default; }
  .row.mg { border-color: #B84A4A; }
  .divider {
    display: flex; align-items: center; gap: 10px; margin: 20px 0 12px;
    font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    color: color-mix(in srgb, var(--pw) 45%, transparent);
  }
  .divider::before, .divider::after {
    content: ""; flex: 1; height: 1px;
    background: color-mix(in srgb, var(--pw) 15%, transparent);
  }

  /* ---------- Game screen ---------- */
  #gameScr { max-width: 520px; margin: 0 auto; padding: 10px 0 24px; }
  .topbar { display: flex; align-items: center; padding: 0 12px 8px; }
  #back { font-size: 22px; padding: 4px 14px 4px 4px; color: var(--brass); }
  .who { flex: 1; text-align: center; }
  .who .nm { font-size: 16px; }
  .who .rt { font-size: 13px; margin-left: 6px; color: color-mix(in srgb, var(--pw) 55%, transparent); }
  .topbar .sp { width: 40px; }
  .tools { display: flex; flex-direction: column; gap: 6px; padding: 10px 16px 0; }
  .tool {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 12px; border-radius: 8px; font-size: 14px;
    border: 1px solid color-mix(in srgb, var(--pw) 15%, transparent);
  }
  .tool:disabled { opacity: .4; cursor: default; }
  .pips { display: flex; gap: 6px; }
  .pip { width: 9px; height: 9px; border-radius: 50%; background: var(--brass); }
  .pip.spent { opacity: .22; }

  #board {
    position: relative; width: 100%; aspect-ratio: 1;
    touch-action: none; container-type: inline-size;
  }
  #squares, #marks, #pieces, #hints { position: absolute; inset: 0; }
  #marks, #hints { pointer-events: none; }
  #pieces { pointer-events: none; }
  .sq, .mark, .hint, .piece { position: absolute; width: 12.5%; height: 12.5%; }
  .sq.l { background: var(--light); }
  .sq.d { background: var(--dark); }
  .mark.last { background: rgba(192,138,62,.28); }
  .mark.sel  { box-shadow: inset 0 0 0 2px var(--brass); }
  .mark.chk  { background: radial-gradient(circle, rgba(205,62,50,.6), rgba(205,62,50,0) 72%); }
  .piece {
    display: flex; align-items: center; justify-content: center;
    font-size: 6vw; font-size: 9.5cqi; line-height: 1;
    transition: transform 140ms ease-out, opacity 120ms linear;
    will-change: transform;
  }
  .piece.w { color: var(--pw); text-shadow: 0 1px 2px rgba(0,0,0,.45); }
  .piece.b {
    color: var(--pb);
    text-shadow: -1px 0 0 var(--pb-line), 1px 0 0 var(--pb-line),
                 0 -1px 0 var(--pb-line), 0 1px 0 var(--pb-line);
  }
  .piece.drag { transition: none; z-index: 10; }
  .piece.gone { opacity: 0; }
  .piece > span { display: block; }
  .piece > span.shake { animation: shake 260ms ease-in-out; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-3px); }
    40% { transform: translateX(3px); }
    60% { transform: translateX(-2px); }
    80% { transform: translateX(2px); }
  }
  .hint::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
  }
  .hint.dot::after {
    inset: 36%; background: color-mix(in srgb, var(--brass) 65%, transparent);
  }
  .hint.ring::after {
    inset: 7%; border: 3px solid color-mix(in srgb, var(--brass) 70%, transparent);
  }
  #status {
    min-height: 22px; text-align: center; padding: 12px 16px 0; font-size: 14px;
    color: color-mix(in srgb, var(--pw) 70%, transparent);
  }
  #status.coach { text-align: left; white-space: pre-line; }
  #status.coach .voice { color: #5B9BD5; }

  /* ---------- End card ---------- */
  .gametabs { display: flex; justify-content: center; gap: 10px; padding: 10px 16px 0; }
  .gametabs button {
    font-size: 12px; padding: 4px 12px; border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--pw) 15%, transparent);
    color: color-mix(in srgb, var(--pw) 55%, transparent);
  }
  .gametabs button:disabled { opacity: .35; cursor: default; }

  #card, #offer {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.55); z-index: 50; padding: 24px;
  }
  .cardbox {
    background: var(--bg); border: 1.5px solid var(--brass); border-radius: 14px;
    padding: 26px 24px; max-width: 340px; width: 100%; text-align: center;
  }
  .cardbox h2 { font-family: Georgia, serif; margin: 0 0 8px; font-size: 22px; }
  .cardbox p { margin: 0 0 18px; font-size: 14px; color: color-mix(in srgb, var(--pw) 75%, transparent); }
  .cardbox .btns { display: flex; gap: 10px; justify-content: center; }
  .cardbox .btns button {
    padding: 8px 16px; border-radius: 8px; font-size: 14px;
    border: 1px solid color-mix(in srgb, var(--pw) 30%, transparent);
  }
  .cardbox .btns button.primary { border-color: var(--brass); color: var(--brass); }

  /* ---------- Review screen ---------- */
  #reviewScr { max-width: 520px; margin: 0 auto; padding: 10px 0 32px; }
  #rvBody { padding: 0 16px; }
  .rvbar {
    height: 6px; border-radius: 3px; overflow: hidden; margin: 10px 0 6px;
    background: color-mix(in srgb, var(--pw) 12%, transparent);
  }
  #rvBarFill { height: 100%; width: 0%; background: var(--brass); transition: width 200ms linear; }
  #rvProgTxt {
    font-size: 13px; text-align: center; min-height: 18px;
    color: color-mix(in srgb, var(--pw) 60%, transparent);
  }
  .rvcounts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 10px 0 4px; }
  .rvchip {
    font-size: 12px; padding: 3px 10px; border-radius: 999px;
    border: 1px solid currentColor;
  }
  #rvGraph { width: 100%; height: 90px; margin: 8px 0 10px; }
  #rvGraph svg { width: 100%; height: 100%; display: block; }
  #rvMini {
    position: relative; width: 68%; margin: 4px auto 8px; aspect-ratio: 1;
    container-type: inline-size;
  }
  .rvsq { position: absolute; width: 12.5%; height: 12.5%; }
  .rvsq.l { background: var(--light); }
  .rvsq.d { background: var(--dark); }
  .rvsq.hl { box-shadow: inset 0 0 0 2px var(--brass); }
  #rvExplain { font-size: 14px; padding: 4px 2px 12px; white-space: pre-line; }
  #rvExplain .voice { color: #5B9BD5; }
  .rvmoves {
    display: grid; grid-template-columns: auto 1fr 1fr; gap: 2px 10px;
    font-size: 14px; align-items: center;
  }
  .rvnum { color: color-mix(in srgb, var(--pw) 45%, transparent); font-size: 13px; }
  .rvmv { text-align: left; padding: 3px 8px; border-radius: 6px; }
  .rvmv.flag { border: 1px solid currentColor; }
  .rvmv.sel { background: color-mix(in srgb, var(--pw) 12%, transparent); }
  .lab-blunder { color: #D9534F; }
  .lab-mistake { color: #E08A3C; }
  .lab-inacc   { color: #CDBB4E; }
  .lab-great   { color: #55B85F; }
  .lab-best    { color: #7FBF7F; }
  .lab-missed  { color: #B07CE8; }
  .tiers { margin: 26px 0 0; }
  .tierrow { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 8px; }
  .tierrow span[id] { display: inline-flex; gap: 8px; }
  .tierlab {
    width: 56px; text-align: right; font-size: 12px;
    color: color-mix(in srgb, var(--pw) 45%, transparent);
  }
  .spend {
    text-align: center; font-size: 12px; margin: 18px 0 0;
    color: color-mix(in srgb, var(--pw) 35%, transparent);
  }
  .spend:empty { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .piece { transition: none; }
    .piece > span.shake { animation: none; }
  }
</style>
</head>
<body data-theme="dusk">

<section id="ladder">
  <div class="themes" id="themes"></div>
  <h1>Anand Chess Club</h1>
  <p class="sub">Beat a member to meet the next one.</p>
  <div id="rows"></div>
  <button class="row hidden" id="resumeBtn">
    <span class="nm">Resume game</span><span class="rt" id="resumeOpp"></span>
  </button>
  <button class="row hidden" id="lastReviewBtn">
    <span class="nm">Review last game</span><span class="rt" id="lastReviewOpp"></span>
  </button>
  <div class="tiers">
    <div class="tierrow"><span class="tierlab">Play as</span><span id="colorChips"></span></div>
    <div class="tierrow"><span class="tierlab">Coach</span><span id="coachTierChips"></span></div>
    <div class="tierrow"><span class="tierlab">Review</span><span id="reviewTierChips"></span></div>
  </div>
  <p class="spend" id="ladderSpend"></p>
  <p class="spend" id="buildTag"></p>
</section>

<section id="gameScr" class="hidden">
  <div class="topbar">
    <button id="back" aria-label="Back to ladder">&#8249;</button>
    <div class="who"><span class="nm" id="oppName"></span><span class="rt" id="oppRt"></span></div>
    <div class="sp"></div>
  </div>
  <div id="board">
    <div id="squares"></div>
    <div id="marks"></div>
    <div id="pieces"></div>
    <div id="hints"></div>
  </div>
  <div class="tools">
    <button class="tool" id="coachBtn">Coach <span class="pips" id="coachPips"></span></button>
    <button class="tool" id="tbBtn">Takeback <span class="pips" id="tbPips"></span></button>
  </div>
  <div class="gametabs">
    <button id="resignBtn">Resign</button>
    <button id="drawBtn">Offer a draw</button>
  </div>
  <div id="status"></div>
</section>

<section id="reviewScr" class="hidden">
  <div class="topbar">
    <button id="rvBack" aria-label="Back to ladder">&#8249;</button>
    <div class="who"><span class="nm">Game review</span><span class="rt" id="rvOpp"></span></div>
    <div class="sp"></div>
  </div>
  <div id="rvBody">
    <div id="rvProgWrap" class="hidden">
      <div class="rvbar"><div id="rvBarFill"></div></div>
      <div id="rvProgTxt"></div>
    </div>
    <div class="rvcounts" id="rvCounts"></div>
    <div id="rvGraph"></div>
    <div id="rvDetail" class="hidden">
      <div id="rvMini"></div>
      <div id="rvExplain"></div>
    </div>
    <div class="rvmoves" id="rvMoves"></div>
    <p class="spend" id="rvCost"></p>
  </div>
</section>

<div id="offer" class="hidden">
  <div class="cardbox">
    <h2 id="offerTitle"></h2>
    <p id="offerMsg"></p>
    <div class="btns">
      <button id="offerNo">Decline</button>
      <button id="offerYes" class="primary">Accept</button>
    </div>
  </div>
</div>

<div id="card" class="hidden">
  <div class="cardbox">
    <h2 id="cardTitle"></h2>
    <p id="cardMsg"></p>
    <div class="btns">
      <button id="reviewBtn">Review</button>
      <button id="rematchBtn">Rematch</button>
      <button id="ladderBtn" class="primary">Back to ladder</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
'use strict';

// ---------- Data (all state lives in memory only) ----------
var LEVELS = [
  { name: 'The New Kid',     rating: 700 },
  { name: 'Coffee House',    rating: 800 },
  { name: 'Book Learner',    rating: 900 },
  { name: 'Tactics Grinder', rating: 1000 },
  { name: 'Weekend Warrior', rating: 1100 },
  { name: 'Club Regular',    rating: 1200 },
  { name: 'Board One',       rating: 1300 },
  { name: 'The Ringer',      rating: 1400 },
  { name: 'Prize Winner',    rating: 1600 },
  { name: 'The Champion',    rating: 1900 }
];
var MEAN_GIRL = { name: 'Anand', rating: 2400, offLadder: true };
var THEMES = ['slate', 'dusk', 'night', 'sage'];
var GLYPH = { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' };
var progress = 0;          // ladder levels beaten (memory only)
var game = null;           // chess.js instance
var opp = null;            // current opponent
var oppIndex = -1;         // ladder index, -1 for Mean Girl
var pieceEls = {};         // square -> piece element
var selected = null;
var aiTimer = null;
var over = false;
var coachLeft = 3, tbLeft = 3;
var chosenColor = 'w';     // ladder setting: the side you want to play
var playerColor = 'w';     // this game's side; board flips to match
var oppColor = 'b';
var resignOffered = false; // he only asks once per game
var oppWinPct = 50;        // his latest read of his own chances
var oppLostStreak = 0;     // consecutive moves he considers lost

var BUILD = '2026-08-29.1';
var $ = function (id) { return document.getElementById(id); };

// GitHub Pages lets browsers cache this page for 10 minutes, which makes
// "is the fix live on my phone?" unanswerable. So the page checks its own
// build id against the server and reloads itself once if it is stale.
function checkFresh() {
  fetch(location.pathname, { cache: 'no-store' }).then(function (r) {
    if (!r.ok) return '';
    return r.text();
  }).then(function (txt) {
    var m = ('' + txt).match(/var BUILD = '([^']+)'/);
    if (m && m[1] !== BUILD && location.search.indexOf(m[1]) === -1) {
      location.replace(location.pathname + '?v=' + encodeURIComponent(m[1]));
    }
  }).catch(function () {});
}
var FILES = 'abcdefgh';

function buzz() { if (navigator.vibrate) navigator.vibrate(10); }

// ---------- Themes ----------
function renderThemes() {
  var box = $('themes');
  box.innerHTML = '';
  THEMES.forEach(function (t) {
    var b = document.createElement('button');
    b.className = 'chip' + (document.body.dataset.theme === t ? ' on' : '');
    b.textContent = t.charAt(0).toUpperCase() + t.slice(1);
    b.onclick = function () { document.body.dataset.theme = t; renderThemes(); saveState(); };
    box.appendChild(b);
  });
}

// Casual vs professional: the same facts, written with more or less care.
function renderTierChips(boxId, current, pick) {
  var box = $(boxId);
  box.innerHTML = '';
  TIERS.forEach(function (t) {
    var b = document.createElement('button');
    b.className = 'chip' + (current === t ? ' on' : '');
    b.textContent = t.charAt(0).toUpperCase() + t.slice(1);
    b.onclick = function () { pick(t); };
    box.appendChild(b);
  });
}

function renderTiers() {
  var cbox = $('colorChips');
  cbox.innerHTML = '';
  [['w', 'White'], ['b', 'Black']].forEach(function (c) {
    var b = document.createElement('button');
    b.className = 'chip' + (chosenColor === c[0] ? ' on' : '');
    b.textContent = c[1];
    b.onclick = function () { chosenColor = c[0]; renderTiers(); saveState(); };
    cbox.appendChild(b);
  });
  renderTierChips('coachTierChips', coachTier, function (t) {
    coachTier = t;
    renderTiers();
    saveState();
  });
  renderTierChips('reviewTierChips', reviewTier, function (t) {
    reviewTier = t;
    renderTiers();
    saveState();
    ensureExplanations();
  });
}

// ---------- Persisted state ----------
// Ladder progress and preferences, kept in the same IndexedDB the models
// use. Device-local: nothing here is ever sent anywhere.
var STATE_KEY = 'app-state';
var stateLoaded = false;

function renderSpend() {
  $('ladderSpend').textContent = spendTotal
    ? 'Coach & review so far: ' + fmtSpend(spendTotal) : '';
}

function saveState() {
  if (!stateLoaded) return;   // never write before the first read lands
  idbPut({
    id: STATE_KEY,
    progress: progress,
    theme: document.body.dataset.theme,
    color: chosenColor,
    coachTier: coachTier,
    reviewTier: reviewTier,
    spendTotal: spendTotal
  }).catch(function () {});   // private mode / quota: play on unsaved
}

function loadState() {
  return idbGet(STATE_KEY).then(function (st) {
    if (!st) return;
    // never regress: if a level was won before this read landed, keep it
    if (typeof st.progress === 'number' && st.progress >= 0) {
      progress = Math.max(progress, Math.min(st.progress, LEVELS.length));
    }
    if (THEMES.indexOf(st.theme) !== -1) document.body.dataset.theme = st.theme;
    if (st.color === 'w' || st.color === 'b') chosenColor = st.color;
    if (TIERS.indexOf(st.coachTier) !== -1) coachTier = st.coachTier;
    if (TIERS.indexOf(st.reviewTier) !== -1) reviewTier = st.reviewTier;
    if (typeof st.spendTotal === 'number' && isFinite(st.spendTotal)) {
      spendTotal += st.spendTotal;   // add, in case a call already billed
    }
  }).catch(function () {}).then(function () {
    return loadGame();
  }).then(function () {
    stateLoaded = true;
    renderThemes();
    renderTiers();
    renderLadder();
    renderSpend();
    $('resumeBtn').classList.toggle('hidden', !pendingGame);
    $('resumeOpp').textContent = pendingGame ? 'vs ' + pendingGame.oppName : '';
    // Reopening the app puts you back in the game you were playing, rather
    // than on the ladder. `!game` so a game already started wins.
    if (pendingGame && !game) resumeGame();
  });
}

// ---------- Ladder ----------
function renderLadder() {
  var box = $('rows');
  box.innerHTML = '';
  LEVELS.forEach(function (lv, i) {
    var b = document.createElement('button');
    var state = i < progress ? 'beaten' : (i === progress ? 'current' : 'locked');
    b.className = 'row ' + state;
    b.innerHTML = '<span class="nm">' + lv.name + '</span>' +
                  '<span class="rt">' + lv.rating + '</span>' +
                  '<span class="st">' + (state === 'beaten' ? '✓' : (state === 'locked' ? 'Locked' : '')) + '</span>';
    if (state !== 'locked') b.onclick = function () { startGame(lv, i); };
    else b.disabled = true;
    box.appendChild(b);
  });
  var div = document.createElement('div');
  div.className = 'divider';
  div.innerHTML = '<span>Not on the ladder</span>';
  box.appendChild(div);
  var mg = document.createElement('button');
  mg.className = 'row mg';
  mg.innerHTML = '<span class="nm">' + MEAN_GIRL.name + '</span>' +
                 '<span class="rt">' + MEAN_GIRL.rating + '</span><span class="st"></span>';
  mg.onclick = function () { startGame(MEAN_GIRL, -1); };
  box.appendChild(mg);
}

// ---------- Board setup ----------
// absName: indices straight out of game.board(), always a8-first.
// sqName/coords: screen <-> square, flipped when the player is Black.
function absName(f, r) { return FILES[f] + (8 - r); }
function sqName(f, r) {                                        // f,r are 0-7 from top-left
  return playerColor === 'w' ? FILES[f] + (8 - r) : FILES[7 - f] + (r + 1);
}
function coords(sq) {
  var f = FILES.indexOf(sq[0]), r = 8 - parseInt(sq[1], 10);
  return playerColor === 'w' ? { f: f, r: r } : { f: 7 - f, r: 7 - r };
}
function place(el, sq) {
  var c = coords(sq);
  el.style.transform = 'translate(' + (c.f * 100) + '%, ' + (c.r * 100) + '%)';
  el.dataset.square = sq;
}

function buildSquares() {
  var box = $('squares');
  box.innerHTML = '';
  for (var r = 0; r < 8; r++) for (var f = 0; f < 8; f++) {
    var d = document.createElement('div');
    d.className = 'sq ' + ((f + r) % 2 === 0 ? 'l' : 'd');
    d.style.transform = 'translate(' + (f * 100) + '%, ' + (r * 100) + '%)';
    box.appendChild(d);
  }
}

function rebuildPieces() {
  var box = $('pieces');
  box.innerHTML = '';
  pieceEls = {};
  var rows = game.board();
  for (var r = 0; r < 8; r++) for (var f = 0; f < 8; f++) {
    var pc = rows[r][f];
    if (!pc) continue;
    var el = document.createElement('div');
    el.className = 'piece ' + pc.color;
    el.innerHTML = '<span>' + GLYPH[pc.type] + '</span>';
    place(el, absName(f, r));
    box.appendChild(el);
    pieceEls[absName(f, r)] = el;
  }
}

// ---------- Marks & hints ----------
function setMarks() {
  var box = $('marks');
  box.innerHTML = '';
  var hist = game.history({ verbose: true });
  var last = hist[hist.length - 1];
  if (last) [last.from, last.to].forEach(function (sq) {
    var m = document.createElement('div');
    m.className = 'mark last';
    place(m, sq);
    box.appendChild(m);
  });
  if (selected) {
    var s = document.createElement('div');
    s.className = 'mark sel';
    place(s, selected);
    box.appendChild(s);
  }
  if (game.in_check()) {
    var side = game.turn();
    var rows = game.board();
    for (var r = 0; r < 8; r++) for (var f = 0; f < 8; f++) {
      var pc = rows[r][f];
      if (pc && pc.type === 'k' && pc.color === side) {
        var k = document.createElement('div');
        k.className = 'mark chk';
        place(k, absName(f, r));
        box.appendChild(k);
      }
    }
  }
}

function showHints(sq) {
  var box = $('hints');
  box.innerHTML = '';
  game.moves({ square: sq, verbose: true }).forEach(function (m) {
    var h = document.createElement('div');
    h.className = 'hint ' + (m.captured ? 'ring' : 'dot');
    place(h, m.to);
    box.appendChild(h);
  });
}
function clearHints() { $('hints').innerHTML = ''; }

// ---------- Moves ----------
function animateMove(mv) {
  var el = pieceEls[mv.from];
  if (!el) { rebuildPieces(); return; }
  delete pieceEls[mv.from];

  var capSq = mv.to;
  if (mv.flags.indexOf('e') !== -1) capSq = mv.to[0] + mv.from[1];  // en passant
  if (mv.captured && pieceEls[capSq]) {
    var dead = pieceEls[capSq];
    delete pieceEls[capSq];
    dead.classList.add('gone');
    setTimeout(function () { dead.remove(); }, 150);
  }

  place(el, mv.to);
  pieceEls[mv.to] = el;
  if (mv.promotion) el.firstChild.textContent = GLYPH[mv.promotion];

  if (mv.flags.indexOf('k') !== -1 || mv.flags.indexOf('q') !== -1) {  // castling: move the rook
    var rank = mv.from[1];
    var rf = mv.flags.indexOf('k') !== -1 ? 'h' + rank : 'a' + rank;
    var rt = mv.flags.indexOf('k') !== -1 ? 'f' + rank : 'd' + rank;
    var rook = pieceEls[rf];
    if (rook) { delete pieceEls[rf]; place(rook, rt); pieceEls[rt] = rook; }
  }
}

function afterMove(mv) {
  selected = null;
  clearHints();
  setMarks();
  if (mv.captured || game.in_check()) buzz();
  if (game.game_over()) { endGame(); return; }
  if (game.turn() === oppColor) {
    setStatus(opp.name + ' is thinking…');
    aiTimer = setTimeout(aiMove, 350 + Math.random() * 400);
  } else {
    setStatus(game.in_check() ? 'Check! Your move.' : 'Your move.');
    maybeOfferResignation();
  }
  saveGame();
  renderTabs();
}

function renderTabs() {
  $('resignBtn').disabled = over;
  $('drawBtn').disabled = over || !game || game.turn() !== playerColor || !!aiTimer;
}

function tryPlayerMove(from, to) {
  var mv = game.move({ from: from, to: to, promotion: 'q' });
  if (!mv) return false;
  animateMove(mv);
  afterMove(mv);
  return true;
}

// ---------- Maia opponent ----------
// The net's policy is the move choice — no search (it would destroy the
// human-like play). Variety comes from temperature + nucleus (top-p)
// sampling over the policy, applied to the whole game, mirroring the
// Temperature/TopP controls of the Maia 3 UCI engine.
// Maia is calibrated to reproduce human play, so it samples its policy
// as-is (T=1). Anand's net is not a human model — sampling it at 1.0
// just adds noise (early h-pawn pushes were 0.8% tail moves), so he
// plays close to argmax with only top-move-level variety.
var MAIA_TEMPERATURE = 1.0;   // ladder: the human distribution, unmodified
var ANAND_TEMPERATURE = 0.3;  // Anand: sharp; ~90% top move, tail crushed
var MAIA_TOP_P = 1.0;         // 1 = disabled (no tail cut)
var PLAYER_ELO = 1000;        // fed as elo_oppo (rough player strength)
var aiMoveSeq = 0;            // invalidates in-flight evals on new game / takeback

function chooseMaiaMove(moves, temperature) {
  if (temperature <= 0) return moves[0][0];
  // Nucleus: smallest prefix of the sorted policy with mass >= MAIA_TOP_P.
  var nucleus = [];
  var mass = 0;
  for (var i = 0; i < moves.length; i++) {
    nucleus.push(moves[i]);
    mass += moves[i][1];
    if (mass >= MAIA_TOP_P) break;
  }
  // Temperature: p^(1/T), renormalised, then sample.
  var sum = 0;
  var weights = nucleus.map(function (m) {
    var w = Math.pow(m[1], 1 / temperature);
    sum += w;
    return w;
  });
  var r = Math.random() * sum;
  for (var j = 0; j < nucleus.length; j++) {
    r -= weights[j];
    if (r <= 0) return nucleus[j][0];
  }
  return nucleus[nucleus.length - 1][0];
}

function oppEngine() { return opp && opp.offLadder ? ANAND : MAIA; }

function aiMove() {
  aiTimer = null;
  if (over) return;
  var seq = ++aiMoveSeq;
  var engine = oppEngine();
  var t0 = performance.now();
  engine.init(netLoadStatus, netLoadProgress).then(function () {
    return engine.evaluate(game.fen(), opp.rating, PLAYER_ELO);
  }).then(function (r) {
    if (over || seq !== aiMoveSeq || game.turn() !== oppColor || !r.moves.length) return;
    // his own read of the position, from his side (value is White's chance)
    oppWinPct = oppColor === 'w' ? r.value * 100 : 100 - r.value * 100;
    var uci = chooseMaiaMove(r.moves, opp.offLadder ? ANAND_TEMPERATURE : MAIA_TEMPERATURE);
    // keep a touch of think time so instant cached replies still feel human
    var delay = Math.max(0, 400 + Math.random() * 500 - (performance.now() - t0));
    setTimeout(function () {
      if (over || seq !== aiMoveSeq || game.turn() !== oppColor) return;
      var mv = game.move({
        from: uci.slice(0, 2),
        to: uci.slice(2, 4),
        promotion: uci.length > 4 ? uci.slice(4) : undefined
      });
      if (!mv) mv = game.move(game.moves()[0]);  // should never happen
      animateMove(mv);
      afterMove(mv);
    }, delay);
  }).catch(function (err) {
    if (seq !== aiMoveSeq) return;
    setStatus(netLabel() + ': ' + err.message + ' — retrying…');
    aiTimer = setTimeout(aiMove, 3000);
  });
}

// Status-line updates while a model loads mid-game.
function netLabel() { return opp && opp.offLadder ? 'Anand' : 'Maia'; }
function netSize() { return opp && opp.offLadder ? '2MB' : '46MB'; }
function netLoadStatus(status) {
  if (status === 'downloading') setStatus('Downloading ' + netLabel() + ' (' + netSize() + ')…');
}
function netLoadProgress(progress) {
  setStatus('Downloading ' + netLabel() + ' (' + netSize() + ')… ' + progress + '%');
}

// ---------- Input: tap and drag ----------
var dragEl = null, dragFrom = null, dragging = false, downPt = null, wasSelected = false;

function squareAt(e) {
  var rect = $('board').getBoundingClientRect();
  var f = Math.floor((e.clientX - rect.left) / rect.width * 8);
  var r = Math.floor((e.clientY - rect.top) / rect.height * 8);
  if (f < 0 || f > 7 || r < 0 || r > 7) return null;
  return sqName(f, r);
}

function playerCanMove() { return !over && game && game.turn() === playerColor && !aiTimer; }

function springBack(el, from) {
  el.classList.remove('drag');
  place(el, from);
  var span = el.firstChild;
  span.classList.remove('shake');
  void span.offsetWidth;
  span.classList.add('shake');
  setTimeout(function () { span.classList.remove('shake'); }, 300);
}

function onDown(e) {
  if (!playerCanMove()) return;
  e.preventDefault();
  var sq = squareAt(e);
  if (!sq) return;
  var pc = game.get(sq);
  if (pc && pc.color === playerColor) {
    wasSelected = (selected === sq);
    selected = sq;
    showHints(sq);
    setMarks();
    dragEl = pieceEls[sq];
    dragFrom = sq;
    dragging = false;
    downPt = { x: e.clientX, y: e.clientY };
    $('board').setPointerCapture(e.pointerId);
  } else if (selected) {
    if (!tryPlayerMove(selected, sq)) {
      selected = null;
      clearHints();
      setMarks();
    }
  }
}

function onMove(e) {
  if (!dragEl || !downPt) return;
  if (!dragging) {
    var dx = e.clientX - downPt.x, dy = e.clientY - downPt.y;
    if (dx * dx + dy * dy < 36) return;
    dragging = true;
    dragEl.classList.add('drag');
  }
  var rect = $('board').getBoundingClientRect();
  var s = rect.width / 8;
  var x = Math.min(Math.max(e.clientX - rect.left - s / 2, -s / 2), rect.width - s / 2);
  var y = Math.min(Math.max(e.clientY - rect.top - s / 2, -s / 2), rect.height - s / 2);
  dragEl.style.transform = 'translate(' + x + 'px, ' + y + 'px)';
}

function onUp(e) {
  if (!dragEl) return;
  var el = dragEl, from = dragFrom;
  dragEl = null; downPt = null;
  if (dragging) {
    dragging = false;
    el.classList.remove('drag');             // restore transition so the snap glides
    var to = squareAt(e);
    if (to === from) {                       // dropped back home: no move attempted
      place(el, from);
    } else if (!to || !tryPlayerMove(from, to)) {
      springBack(el, from);
      selected = null; clearHints(); setMarks();
    }
  } else if (wasSelected) {          // tapped the already-selected piece: deselect
    selected = null;
    clearHints();
    setMarks();
  }
}

// ---------- Coach & takeback ----------
function renderPips() {
  [['coachPips', coachLeft], ['tbPips', tbLeft]].forEach(function (p) {
    var box = $(p[0]);
    box.innerHTML = '';
    for (var i = 0; i < 3; i++) {
      var d = document.createElement('span');
      d.className = 'pip' + (i >= p[1] ? ' spent' : '');
      box.appendChild(d);
    }
  });
  $('coachBtn').disabled = coachLeft === 0;
  $('tbBtn').disabled = tbLeft === 0;
}

// ---------- Coach ----------
// One tap, one pip: Stockfish (depth 18, MultiPV 3) is the authority;
// Anand's net proposes his sharper move; if they differ, his move is
// measured by Stockfish and the gap stated in win percentage. One Claude
// call writes both voices. Everything is cached by FEN.
var COACH_SYSTEM =
  'You explain chess to a beginner rated around 1000. Stockfish is the ' +
  'authority on what is true — you are only translating it. Never invent a ' +
  'move, line, or tactic that is not in the data given to you. No engine ' +
  'numbers in your answer. Two to three sentences per voice. Plain language.\n' +
  'Anand’s move has been measured by Stockfish. If it is worse, say plainly ' +
  'that it is worse and roughly what it costs. Never present a losing move as ' +
  'merely interesting.\n' +
  'Always be clear whose piece is whose; never call an opponent’s piece "yours".';

function winPct(cp) {
  return 50 + 50 * (2 / (1 + Math.exp(-0.00368208 * cp)) - 1);
}
function pvToCp(pv) {   // SF pv entry -> centipawns from the side to move
  if (!pv) return 0;
  if (pv.mate !== null && pv.mate !== undefined) return pv.mate > 0 ? 10000 : -10000;
  return pv.cp;
}

function sanLine(fen, ucis, maxPlies) {
  var g = new Chess(fen);
  var out = [];
  for (var i = 0; i < ucis.length && i < maxPlies; i++) {
    var u = ucis[i];
    var mv = g.move({ from: u.slice(0, 2), to: u.slice(2, 4), promotion: u.length > 4 ? u.slice(4) : undefined });
    if (!mv) break;
    out.push(mv.san);
  }
  return out.join(' ');
}
function sanOf(fen, uci) { return sanLine(fen, [uci], 1); }

// "White pieces: Kg1 Qd1 ... | Black pieces: ..." so ownership is explicit.
function pieceOwnership(fen) {
  var g = new Chess(fen);
  var order = { k: 0, q: 1, r: 2, b: 3, n: 4, p: 5 };
  var sides = { w: [], b: [] };
  'abcdefgh'.split('').forEach(function (f) {
    for (var r = 1; r <= 8; r++) {
      var sq = f + r;
      var pc = g.get(sq);
      if (pc) sides[pc.color].push({ t: pc.type, sq: sq });
    }
  });
  function fmt(list) {
    list.sort(function (a, b) { return order[a.t] - order[b.t]; });
    return list.map(function (p) {
      return (p.t === 'p' ? '' : p.t.toUpperCase()) + p.sq;
    }).join(' ');
  }
  return 'White pieces: ' + fmt(sides.w) + ' | Black pieces: ' + fmt(sides.b);
}

// -- device-local key + cache storage (same IndexedDB the models use) --
// One cached connection, and the open is retried with a timeout: Safari has
// a known bug where a main-page indexedDB.open can silently never fire its
// callbacks, which would lose progress and positions while the workers'
// model cache (a separate context) keeps working.
var idbConn = null;

function idbOpen() {
  if (idbConn) return Promise.resolve(idbConn);
  return new Promise(function (resolve, reject) {
    var attempts = 0;
    (function tryOpen() {
      attempts++;
      var settled = false;
      var req = indexedDB.open('MaiaModels', 1);
      var timer = setTimeout(function () {
        if (settled) return;
        settled = true;
        if (attempts < 3) tryOpen();
        else reject(new Error('storage did not respond'));
      }, 1500);
      req.onerror = function () {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        if (attempts < 3) setTimeout(tryOpen, 300);
        else reject(req.error);
      };
      req.onsuccess = function () {
        if (settled) { try { req.result.close(); } catch (ignore) {} return; }
        settled = true;
        clearTimeout(timer);
        idbConn = req.result;
        idbConn.onclose = function () { idbConn = null; };
        idbConn.onversionchange = function () {
          try { idbConn.close(); } catch (ignore) {}
          idbConn = null;
        };
        resolve(idbConn);
      };
      req.onupgradeneeded = function (e) {
        var db = e.target.result;
        if (!db.objectStoreNames.contains('models')) {
          db.createObjectStore('models', { keyPath: 'id' });
        }
      };
    })();
  });
}
function idbGet(id) {
  return idbOpen().then(function (db) {
    return new Promise(function (resolve, reject) {
      var req = db.transaction(['models'], 'readonly').objectStore('models').get(id);
      req.onsuccess = function () { resolve(req.result || null); };
      req.onerror = function () { reject(req.error); };
    });
  });
}
function idbPut(obj) {
  return idbOpen().then(function (db) {
    return new Promise(function (resolve, reject) {
      var req = db.transaction(['models'], 'readwrite').objectStore('models').put(obj);
      req.onsuccess = function () { resolve(); };
      req.onerror = function () { reject(req.error); };
    });
  });
}
function idbDelete(id) {
  return idbOpen().then(function (db) {
    return new Promise(function (resolve, reject) {
      var req = db.transaction(['models'], 'readwrite').objectStore('models').delete(id);
      req.onsuccess = function () { resolve(); };
      req.onerror = function () { reject(req.error); };
    });
  });
}

// Tag an error with the stage that produced it, so failures are never generic.
function stageErr(stage) {
  return function (err) {
    var msg = err && err.message ? err.message : 'unknown error';
    if (msg.lastIndexOf(stage, 0) === 0) throw err;   // already tagged
    throw new Error(stage + ' — ' + msg);
  };
}

function getCoachKey() {
  return idbGet('claude-api-key').catch(function (e) {
    throw new Error('Key storage (IndexedDB) unavailable — ' + (e && e.message ? e.message : e));
  }).then(function (rec) {
    if (rec && rec.key) return rec.key;
    var k = window.prompt('Paste your Claude API key for the Coach (kept only on this device):');
    if (k === null) throw new Error('No API key — the prompt was cancelled. Tap Coach to try again');
    if (!k.trim()) throw new Error('No API key — nothing was entered. Tap Coach to try again');
    k = k.trim();
    return idbPut({ id: 'claude-api-key', key: k }).catch(function () {}).then(function () { return k; });
  });
}

// -- engine work, cached by FEN --
var coachData = {};   // fen -> Promise of measured analysis
var coachText = {};   // fen -> successful Claude prose

function coachEngineData(fen) {
  if (coachData[fen]) return coachData[fen];
  var p = SF.init().catch(stageErr('Stockfish didn’t load')).then(function () {
    return Promise.all([
      SF.analyse(fen, { depth: 18, multipv: 3 }).catch(stageErr('Stockfish analysis failed')),
      ANAND.init().catch(stageErr('Anand’s net didn’t load')).then(function () {
        return ANAND.evaluate(fen).catch(stageErr('Anand’s net failed'));
      })
    ]);
  }).then(function (rs) {
    var sf = rs[0];
    var best = sf.pvs[0];
    if (!best) throw new Error('no line found');
    var d = {
      fen: fen,
      bestSan: sanOf(fen, sf.bestmove),
      bestLine: sanLine(fen, best.line.split(' '), 6),
      bestMate: best.mate,
      bestWin: winPct(pvToCp(best)),
      alts: sf.pvs.slice(1).map(function (pv) {
        return { san: sanOf(fen, pv.move), win: winPct(pvToCp(pv)) };
      }),
      anandUci: rs[1].moves[0][0]
    };
    d.anandSan = sanOf(fen, d.anandUci);
    d.agree = d.anandUci === sf.bestmove;
    if (d.agree) return d;
    // measure Anand's move: evaluate the position it leaves, same depth
    var g = new Chess(fen);
    g.move({
      from: d.anandUci.slice(0, 2),
      to: d.anandUci.slice(2, 4),
      promotion: d.anandUci.length > 4 ? d.anandUci.slice(4) : undefined
    });
    var childFen = g.fen();
    return SF.analyse(childFen, { depth: 18, multipv: 1 })
      .catch(stageErr('Stockfish check of Anand’s move failed'))
      .then(function (r2) {
      var reply = r2.pvs[0];
      d.anandWin = 100 - winPct(pvToCp(reply));   // child eval is opponent-to-move
      d.anandCost = d.bestWin - d.anandWin;
      d.anandLine = d.anandSan + (reply ? ' ' + sanLine(childFen, reply.line.split(' '), 5) : '');
      return d;
    });
  });
  p = p.catch(function (e) { delete coachData[fen]; throw e; });
  coachData[fen] = p;
  return p;
}

function coachPayload(d) {
  var lines = [];
  lines.push('Position (FEN): ' + d.fen);
  var me = playerColor === 'w' ? 'WHITE' : 'BLACK';
  var them = playerColor === 'w' ? 'Black' : 'White';
  lines.push('The student you are coaching is ' + me + '. It is ' +
    (playerColor === 'w' ? 'White' : 'Black') + ' to move. ' + them + ' is the opponent — ' +
    them + '’s pieces are never "yours" or "the student’s".');
  lines.push(pieceOwnership(d.fen));
  lines.push('Stockfish, depth 18 (the authority):');
  lines.push('- Best move: ' + d.bestSan +
    ' | White win chance with best play: ' + d.bestWin.toFixed(1) + '%' +
    (d.bestMate ? ' | this line forces checkmate in ' + Math.abs(d.bestMate) : '') +
    ' | main line: ' + d.bestLine);
  d.alts.forEach(function (a) {
    lines.push('- Alternative: ' + a.san + ' (win chance ' + a.win.toFixed(1) + '%)');
  });
  if (d.agree) {
    lines.push('Anand’s suggestion: ' + d.anandSan + ' — the SAME move as Stockfish’s best.');
    lines.push('They agree. Reply with ONE short line saying the Computer and GM Anand ' +
      'both recommend ' + d.bestSan + ' and, in plain words, why it is good. ' +
      'Do not manufacture a disagreement. Call Stockfish "the Computer" and Anand "GM Anand".');
  } else {
    lines.push('Anand’s suggestion: ' + d.anandSan +
      ' | measured by Stockfish: White win chance ' + d.anandWin.toFixed(1) + '%, which is ' +
      d.anandCost.toFixed(1) + ' percentage points worse than the best move' +
      ' | line after it: ' + d.anandLine);
    lines.push('Reply with exactly two short paragraphs separated by a blank line, ' +
      'the first starting "Computer:" (the Stockfish voice) explaining the best move, ' +
      'the second starting "GM Anand:" pitching his suggestion in his sharp voice ' +
      'while stating plainly what it costs.');
  }
  return lines.join('\n');
}

// The live Coach runs on Sonnet: it must answer in a second or two on a
// narrow, well-specified task. The review writes its explanations offline,
// where the stronger model is worth the extra time.
// Two coaching tiers, selectable per surface. The senior thinks harder and
// costs more; the junior is quicker and cheaper. Both are handed exactly the
// same Stockfish facts, so this only changes how the advice is written.
var TIERS = ['casual', 'professional'];
var TIER_MODELS = { casual: 'claude-sonnet-5', professional: 'claude-opus-4-6' };
var coachTier = 'casual';         // live: must answer while you wait at the board
var reviewTier = 'professional';  // read at leisure after the game

// Published rates, dollars per million tokens (input / output).
var MODEL_RATES = {
  'claude-sonnet-5': { inp: 2, out: 10 },
  'claude-opus-4-6': { inp: 5, out: 25 }
};
var spendTotal = 0;   // this session only, until progress is persisted

function askCost(model, usage) {
  var r = MODEL_RATES[model];
  if (!r || !usage) return 0;
  return ((usage.input_tokens || 0) * r.inp + (usage.output_tokens || 0) * r.out) / 1e6;
}

function fmtSpend(v) { return '$' + (v < 1 ? v.toFixed(4) : v.toFixed(2)); }

function coachAsk(payload, key, system, model, onCost) {
  return fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: model || TIER_MODELS[coachTier],
      max_tokens: 400,
      system: system || COACH_SYSTEM,
      messages: [{ role: 'user', content: payload }]
    })
  }).catch(function (e) {
    // fetch itself failing = no response at all
    throw new Error('No internet — the Claude API could not be reached (' +
      (e && e.message ? e.message : e) + ')');
  }).then(function (res) {
    if (res.ok) return res.json();
    // pull the API's own explanation out of the error body when there is one
    return res.json().catch(function () { return {}; }).then(function (body) {
      var apiMsg = body && body.error && body.error.message ? ' — ' + body.error.message : '';
      if (res.status === 401 || res.status === 403) {
        return idbDelete('claude-api-key').catch(function () {}).then(function () {
          throw new Error('API key rejected' + apiMsg + ' — tap Coach to enter a new one');
        });
      }
      if (res.status === 429) {
        throw new Error('Claude API error 429 — rate limited or out of credits' + apiMsg);
      }
      throw new Error('Claude API error ' + res.status + apiMsg);
    });
  }).then(function (j) {
    var cost = askCost(model || TIER_MODELS[coachTier], j.usage);
    spendTotal += cost;
    saveState();
    if (onCost) onCost(cost);
    var txt = (j.content || []).filter(function (c) { return c.type === 'text'; })
      .map(function (c) { return c.text; }).join(' ').trim();
    if (!txt) throw new Error('empty reply');
    return txt;
  });
}

var coachBusy = false;
var coachSpinTimer = null;
var COACH_DOTS = ['.', '..', '...'];

function coachSpinner(on) {
  if (coachSpinTimer) { clearInterval(coachSpinTimer); coachSpinTimer = null; }
  if (on) {
    var n = 0;
    setStatus('Coach is thinking.');
    coachSpinTimer = setInterval(function () {
      n = (n + 1) % 3;
      setStatus('Coach is thinking' + COACH_DOTS[n]);
    }, 400);
  }
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function coachShow(fen, text) {
  // don't clobber the status if the position moved on while we worked
  if (!over && game && game.fen() === fen) {
    var s = $('status');
    s.classList.add('coach');   // left-aligned, keeps blank lines
    s.innerHTML = escapeHtml(text)
      .replace(/^(Computer:|GM Anand:)/gm, '<span class="voice">$1</span>');
  }
}

function useCoach() {
  if (over || game.turn() !== playerColor || aiTimer || coachBusy) return;
  var fen = game.fen();
  // Cached per tier: switching tiers asks again rather than replaying the
  // other tier's answer. The engine work underneath is shared either way.
  var ck = fen + '|' + coachTier;
  if (coachText[ck]) { coachShow(fen, coachText[ck]); return; }   // cached: free
  if (coachLeft === 0) return;
  coachLeft--;
  renderPips();
  saveGame();
  coachBusy = true;
  getCoachKey().then(function (key) {
    coachSpinner(true);
    return coachEngineData(fen).then(function (d) {
      return coachAsk(coachPayload(d), key, null, TIER_MODELS[coachTier]).then(function (txt) {
        coachText[ck] = txt;
        coachSpinner(false);
        coachShow(fen, txt);
      }, function (apiErr) {
        // API failed: still show Stockfish's move, plus the real reason
        coachSpinner(false);
        coachShow(fen, 'Computer: ' + d.bestSan + '. (' + apiErr.message + ')');
      });
    });
  }).catch(function (err) {
    // nothing useful produced: refund the pip and say exactly what broke
    coachSpinner(false);
    coachLeft++;
    renderPips();
    coachShow(fen, 'Coach: ' + err.message);
  }).then(function () { coachBusy = false; });
}

// ---------- Post-game review ----------
// Stockfish depth 18 on every position (MultiPV 3 at the student's
// decision points, MultiPV 1 on the replies for the before/after win
// probabilities). Moves classified on win probability; flagged moves get
// one Claude explanation each. Everything cached with the game in memory.
var REVIEW_SYSTEM =
  'You explain chess to a beginner rated around 1000. Stockfish is the ' +
  'authority on what is true — you are only translating it. Never invent a ' +
  'move, line, or tactic that is not in the data given to you. No engine ' +
  'numbers in your answer. Two to three sentences. Plain language.\n' +
  'Always be clear whose piece is whose; never call an opponent’s piece "yours".';

var RV_LABELS = {
  missed:     { sym: '×',  txt: 'Missed chance', cls: 'lab-missed',  flag: true },
  blunder:    { sym: '??', txt: 'Blunder',       cls: 'lab-blunder', flag: true },
  mistake:    { sym: '?',  txt: 'Mistake',       cls: 'lab-mistake', flag: true },
  inaccuracy: { sym: '?!', txt: 'Inaccuracy',    cls: 'lab-inacc',   flag: true },
  great:      { sym: '!',  txt: 'Great',         cls: 'lab-great',   flag: true },
  best:       { sym: '✓',  txt: 'Best',          cls: 'lab-best',    flag: false },
  excellent:  { sym: '',   txt: 'Excellent',     cls: '',            flag: false },
  good:       { sym: '',   txt: 'Good',          cls: '',            flag: false }
};
var RV_BOOK_PLIES = 10;   // moves this early count as "in book" for the Great rule

var reviews = {};         // gameKey -> review object (session cache)
var lastGameRec = null;   // snapshot of the most recently finished game
var curReview = null;
var rvSelected = -1;

function gameKey(rec) {
  return rec.opp + '|' + (rec.color || 'w') + '|' + rec.result + '|' + rec.sans.join(' ');
}

function createReview(rec) {
  var g = new Chess();
  var fens = [g.fen()];
  var ucis = [];
  rec.sans.forEach(function (san) {
    var mv = g.move(san);
    ucis.push(mv.from + mv.to + (mv.promotion || ''));
    fens.push(g.fen());
  });
  return {
    opp: rec.opp, result: rec.result, sans: rec.sans,
    fens: fens, ucis: ucis,
    color: rec.color || 'w',   // the side the student played
    evals: [], win: [],        // win[] is the STUDENT's win probability
    moves: [],                 // one entry per student move
    counts: {},
    status: 'pending', done: 0, total: fens.length - 1,
    exDone: 0, exTotal: 0, error: null, cost: 0
  };
}

// Pause the heavy analysis while a game is actually being played.
function rvWaitIfPlaying() {
  return new Promise(function (resolve) {
    (function check() {
      var playing = !$('gameScr').classList.contains('hidden') && game && !over;
      if (!playing) resolve(); else setTimeout(check, 1500);
    })();
  });
}

// True when ply idx is one of the student's own decisions.
function studentTurn(rv, idx) { return (idx % 2 === 0) === (rv.color === 'w'); }

function classifyReviewMove(m) {
  if (m.oppGain > 20 && m.loss > 5) return 'missed';
  if (m.isBest) {
    if (m.ply >= RV_BOOK_PLIES && m.loss < 1 && m.secondGap >= 20) return 'great';
    return 'best';
  }
  if (m.loss < 2) return 'excellent';
  if (m.loss < 5) return 'good';
  if (m.loss < 10) return 'inaccuracy';
  if (m.loss < 20) return 'mistake';
  return 'blunder';
}

function buildMoveTable(rv) {
  rv.moves = [];
  rv.counts = {};
  var n = rv.fens.length - 1;
  for (var k = rv.color === 'w' ? 0 : 1; k < n; k += 2) {
    var ev = rv.evals[k];
    if (!ev || !ev.pvs[0]) continue;
    var m = {
      ply: k,
      san: rv.sans[k],
      uci: rv.ucis[k],
      fenBefore: rv.fens[k],
      before: rv.win[k],
      after: rv.win[k + 1],
      loss: Math.max(0, rv.win[k] - rv.win[k + 1]),
      isBest: rv.ucis[k] === ev.bestmove,
      secondGap: ev.pvs[1]
        ? winPct(pvToCp(ev.pvs[0])) - winPct(pvToCp(ev.pvs[1]))
        : 100,
      oppGain: k >= 1 ? Math.max(0, rv.win[k] - rv.win[k - 1]) : 0,
      oppSan: k >= 1 ? rv.sans[k - 1] : null,
      bestSan: sanOf(rv.fens[k], ev.bestmove),
      bestLine: sanLine(rv.fens[k], ev.pvs[0].line.split(' '), 6),
      color: rv.color,
      explanations: {}, exErrors: {}   // keyed by tier
    };
    m.label = classifyReviewMove(m);
    m.flagged = RV_LABELS[m.label].flag;
    rv.counts[m.label] = (rv.counts[m.label] || 0) + 1;
    rv.moves.push(m);
  }
}

function reviewPayload(m) {
  var lines = [];
  var me = m.color === 'w' ? 'WHITE' : 'BLACK';
  var them = m.color === 'w' ? 'Black' : 'White';
  lines.push('You are reviewing ONE move from a finished game. The student you are ' +
    'coaching is ' + me + '. ' + them + ' is the opponent — ' + them + '’s pieces are ' +
    'never "yours" or "the student’s".');
  lines.push('Position before the move (FEN): ' + m.fenBefore);
  lines.push(pieceOwnership(m.fenBefore));
  lines.push('The student (' + (m.color === 'w' ? 'White' : 'Black') + ') played: ' + m.san +
    ' — their win chance went from ' + m.before.toFixed(1) + '% to ' + m.after.toFixed(1) + '%.');
  lines.push('Stockfish’s best move here: ' + m.bestSan + ' | main line: ' + m.bestLine);
  if (m.label === 'missed') {
    lines.push('IMPORTANT: ' + them + '’s previous move (' + m.oppSan + ') was a serious error that ' +
      'raised the student’s win chance by ' + m.oppGain.toFixed(1) + ' points, and the student ' +
      'failed to punish it. Lead with the missed punishment: what ' + m.bestSan +
      ' would have won and how to spot chances like this.');
  } else if (m.label === 'great') {
    lines.push('This move WAS Stockfish’s best, and by far the only strong one. ' +
      'Praise the find and explain in plain words why it works.');
  } else {
    lines.push('The move lost ground (' + RV_LABELS[m.label].txt + '). Explain in plain words ' +
      'what it overlooks and why ' + m.bestSan + ' was better.');
  }
  lines.push('Reply with two to three sentences of plain coaching. No labels, no engine numbers.');
  return lines.join('\n');
}

function runReview(rv) {
  rv.status = 'analysing';
  var n = rv.fens.length - 1;
  var chain = SF.init().catch(stageErr('Stockfish didn’t load'));
  var i;
  for (i = 0; i < n; i++) {
    (function (idx) {
      chain = chain.then(rvWaitIfPlaying).then(function () {
        return SF.analyse(rv.fens[idx], { depth: 18, multipv: studentTurn(rv, idx) ? 3 : 1 })
          .catch(stageErr('Stockfish analysis failed at move ' + (Math.floor(idx / 2) + 1)));
      }).then(function (r) {
        rv.evals[idx] = r;
        rv.win[idx] = studentTurn(rv, idx)
          ? winPct(pvToCp(r.pvs[0]))
          : 100 - winPct(pvToCp(r.pvs[0]));
        rv.done++;
        renderReviewIfVisible();
      });
    })(i);
  }
  chain.then(function () {
    rv.win[n] = rv.result === 'win' ? 100 : (rv.result === 'loss' ? 0 : 50);
    buildMoveTable(rv);
    rv.status = 'explaining';
    rv.exBusy = true;
    renderReviewIfVisible();
    return runExplanations(rv);
  }).then(function () {
    rv.exBusy = false;
    rv.status = 'done';
    renderReviewIfVisible();
  }).catch(function (e) {
    rv.exBusy = false;
    rv.status = 'error';
    rv.error = e.message;
    renderReviewIfVisible();
  });
}

// Called when the review tier changes, or the screen is opened: fills in
// whatever the selected tier is still missing.
function ensureExplanations() {
  var rv = curReview;
  if (!rv || rv.exBusy || rv.status !== 'done') return;
  var missing = rv.moves.some(function (m) {
    return m.flagged && !m.explanations[reviewTier] && !m.exErrors[reviewTier];
  });
  if (!missing) { renderReviewIfVisible(); return; }
  rv.exBusy = true;
  rv.status = 'explaining';
  renderReviewIfVisible();
  runExplanations(rv).catch(function () {}).then(function () {
    rv.exBusy = false;
    rv.status = 'done';
    renderReviewIfVisible();
  });
}

// Writes the explanations missing for the tier now selected. Switching tiers
// re-asks only the flagged moves; the Stockfish analysis is never redone.
function runExplanations(rv) {
  var tier = reviewTier;
  var flagged = rv.moves.filter(function (m) {
    return m.flagged && !m.explanations[tier] && !m.exErrors[tier];
  });
  rv.exTotal = flagged.length;
  rv.exDone = 0;
  if (!flagged.length) return Promise.resolve();
  return getCoachKey().then(function (key) {
    var chain = Promise.resolve();
    flagged.forEach(function (m) {
      chain = chain.then(function () {
        return coachAsk(reviewPayload(m), key, REVIEW_SYSTEM, TIER_MODELS[tier], function (c) {
          rv.cost += c;
        }).then(
          function (txt) { m.explanations[tier] = txt; },
          function (err) { m.exErrors[tier] = err.message; }
        );
      }).then(function () {
        rv.exDone++;
        renderReviewIfVisible();
      });
    });
    return chain;
  }, function (keyErr) {
    flagged.forEach(function (m) { m.exErrors[tier] = keyErr.message; });
  });
}

// ---------- Review screen rendering ----------
function startReview() {
  if (!lastGameRec || !lastGameRec.sans.length) return;
  var key = gameKey(lastGameRec);
  curReview = reviews[key];
  if (!curReview) {
    curReview = reviews[key] = createReview(lastGameRec);
    runReview(curReview);
  }
  rvSelected = -1;
  $('ladder').classList.add('hidden');
  $('gameScr').classList.add('hidden');
  $('card').classList.add('hidden');
  $('reviewScr').classList.remove('hidden');
  $('rvOpp').textContent = 'vs ' + curReview.opp;
  renderReview();
  ensureExplanations();   // fills in the tier if it changed since last time
}

function rvBackToLadder() {
  $('reviewScr').classList.add('hidden');
  toLadder();
}

function renderReviewIfVisible() {
  if (!$('reviewScr').classList.contains('hidden')) renderReview();
}

function renderReview() {
  var rv = curReview;
  if (!rv) return;
  var pw = $('rvProgWrap');
  if (rv.status === 'analysing' || rv.status === 'pending') {
    pw.classList.remove('hidden');
    $('rvBarFill').style.width = Math.round(rv.done / rv.total * 100) + '%';
    $('rvProgTxt').textContent = 'Analysing position ' + rv.done + ' of ' + rv.total + '…';
  } else if (rv.status === 'explaining') {
    pw.classList.remove('hidden');
    $('rvBarFill').style.width = (rv.exTotal ? Math.round(rv.exDone / rv.exTotal * 100) : 100) + '%';
    $('rvProgTxt').textContent = 'Writing explanations ' + rv.exDone + ' of ' + rv.exTotal + '…';
  } else if (rv.status === 'error') {
    pw.classList.remove('hidden');
    $('rvBarFill').style.width = '0%';
    $('rvProgTxt').textContent = rv.error;
  } else {
    pw.classList.add('hidden');
  }
  renderRvCounts(rv);
  renderRvGraph(rv);
  renderRvMoves(rv);
  renderRvDetail(rv);
  var parts = [];
  if (rv.cost) parts.push('This review: ' + fmtSpend(rv.cost));
  if (spendTotal) parts.push('Total so far: ' + fmtSpend(spendTotal));
  $('rvCost').textContent = parts.join(' · ');
}

function renderRvCounts(rv) {
  var box = $('rvCounts');
  box.innerHTML = '';
  if (!rv.moves.length) return;
  Object.keys(RV_LABELS).forEach(function (label) {
    var c = rv.counts[label];
    if (!c) return;
    var chip = document.createElement('span');
    chip.className = 'rvchip ' + RV_LABELS[label].cls;
    chip.textContent = RV_LABELS[label].txt + ' ' + (RV_LABELS[label].sym ? RV_LABELS[label].sym + ' ' : '') + '× ' + c;
    box.appendChild(chip);
  });
}

function renderRvGraph(rv) {
  var n = rv.fens.length - 1;
  if (n < 1) { $('rvGraph').innerHTML = ''; return; }
  var pts = [];
  for (var i = 0; i <= n; i++) {
    if (rv.win[i] !== undefined && rv.win[i] !== null) {
      pts.push((i / n * 100).toFixed(2) + ',' + (50 - rv.win[i] / 2).toFixed(2));
    }
  }
  var dots = '';
  rv.moves.forEach(function (m) {
    if (!m.flagged) return;
    var x = ((m.ply + 1) / n * 100).toFixed(2);
    var y = (50 - m.after / 2).toFixed(2);
    dots += '<circle class="' + RV_LABELS[m.label].cls + '" cx="' + x + '" cy="' + y +
      '" r="1.8" fill="currentColor"></circle>';
  });
  $('rvGraph').innerHTML =
    '<svg viewBox="0 0 100 50" preserveAspectRatio="none">' +
    '<line x1="0" y1="25" x2="100" y2="25" stroke="currentColor" stroke-opacity="0.25" ' +
    'stroke-width="0.4" stroke-dasharray="2 2"></line>' +
    (pts.length > 1
      ? '<polyline points="' + pts.join(' ') + '" fill="none" stroke="var(--brass)" ' +
        'stroke-width="0.9" vector-effect="non-scaling-stroke"></polyline>'
      : '') +
    dots + '</svg>';
}

function renderRvMoves(rv) {
  var box = $('rvMoves');
  box.innerHTML = '';
  var n = rv.sans.length;
  // Always laid out as "1. white black"; whichever side the student played
  // is the one that carries labels and can be tapped.
  for (var k = 0; k < n; k += 2) {
    var num = document.createElement('span');
    num.className = 'rvnum';
    num.textContent = (k / 2 + 1) + '.';
    box.appendChild(num);

    [k, k + 1].forEach(function (ply) {
      var cell;
      if (ply >= n) {
        cell = document.createElement('span');
        cell.className = 'rvmv';
        box.appendChild(cell);
        return;
      }
      var m = null;
      for (var j = 0; j < rv.moves.length; j++) if (rv.moves[j].ply === ply) { m = rv.moves[j]; break; }
      if (m && m.flagged) {
        cell = document.createElement('button');
        cell.setAttribute('data-ply', ply);
      } else {
        cell = document.createElement('span');
      }
      cell.className = 'rvmv' + (m ? ' ' + RV_LABELS[m.label].cls + (m.flagged ? ' flag' : '') : '') +
        (rvSelected === ply ? ' sel' : '');
      cell.textContent = rv.sans[ply] + (m && RV_LABELS[m.label].sym ? ' ' + RV_LABELS[m.label].sym : '');
      box.appendChild(cell);
    });
  }
}

function renderRvMini(fen, uci, flip) {
  var box = $('rvMini');
  box.innerHTML = '';
  var hl = uci ? [uci.slice(0, 2), uci.slice(2, 4)] : [];
  var pos = function (i) { return (flip ? 7 - i : i) * 12.5; };
  var placement = fen.split(' ')[0].split('/');
  for (var row = 0; row < 8; row++) {          // row 0 = rank 8, top
    var file = 0;
    for (var i = 0; i < placement[row].length; i++) {
      var ch = placement[row].charAt(i);
      if (!isNaN(parseInt(ch, 10))) { file += parseInt(ch, 10); continue; }
      var pc = document.createElement('div');
      pc.className = 'piece ' + (ch === ch.toUpperCase() ? 'w' : 'b');
      pc.style.left = pos(file) + '%';
      pc.style.top = pos(row) + '%';
      pc.innerHTML = '<span>' + GLYPH[ch.toLowerCase()] + '</span>';
      box.appendChild(pc);
      file++;
    }
  }
  for (var f = 0; f < 8; f++) {
    for (var r = 0; r < 8; r++) {
      var sq = document.createElement('div');
      var name = FILES[f] + (8 - r);
      sq.className = 'rvsq ' + ((f + r) % 2 === 0 ? 'l' : 'd') +
        (hl.indexOf(name) !== -1 ? ' hl' : '');
      sq.style.left = pos(f) + '%';
      sq.style.top = pos(r) + '%';
      box.insertBefore(sq, box.firstChild);   // squares under pieces
    }
  }
}

function renderRvDetail(rv) {
  var det = $('rvDetail');
  if (rvSelected < 0) { det.classList.add('hidden'); return; }
  var m = null;
  for (var j = 0; j < rv.moves.length; j++) if (rv.moves[j].ply === rvSelected) { m = rv.moves[j]; break; }
  if (!m) { det.classList.add('hidden'); return; }
  det.classList.remove('hidden');
  renderRvMini(m.fenBefore, m.uci, rv.color === 'b');
  var head = 'You played ' + m.san +
    (RV_LABELS[m.label].sym ? ' ' + RV_LABELS[m.label].sym : '') +
    ' (' + RV_LABELS[m.label].txt + '). Best: ' + m.bestSan + '.';
  var body;
  if (m.explanations[reviewTier]) body = 'GM Anand: ' + m.explanations[reviewTier];
  else if (m.exErrors[reviewTier]) body = '(No explanation — ' + m.exErrors[reviewTier] + ')';
  else body = rv.status === 'done' ? '' : '(GM Anand is writing…)';
  $('rvExplain').innerHTML =
    '<span class="' + RV_LABELS[m.label].cls + '">' + escapeHtml(head) + '</span>\n' +
    escapeHtml(body).replace(/^(GM Anand:)/, '<span class="voice">$1</span>');
}

// ---------- Resign, draw offers, and his resignation ----------
// He judges the position with his own net's value head — the number he
// already produces on every move, so nothing extra is computed.
var RESIGN_AT = 8;      // his win chance, in percent
var RESIGN_STREAK = 2;  // consecutive moves before he gives up
var OFFER_MIN_PLIES = 16;

function showOffer(title, msg, onYes, onNo) {
  $('offerTitle').textContent = title;
  $('offerMsg').textContent = msg;
  $('offer').classList.remove('hidden');
  $('offerYes').onclick = function () { $('offer').classList.add('hidden'); onYes(); };
  $('offerNo').onclick = function () { $('offer').classList.add('hidden'); if (onNo) onNo(); };
}

function playerResign() {
  if (over || !game || coachBusy) return;
  showOffer('Resign?', 'Hand the game to ' + opp.name + '?', function () {
    endGame('resign-player');
  });
}

function playerOfferDraw() {
  if (over || !game || aiTimer || coachBusy) return;
  if (game.turn() !== playerColor) return;
  var plies = game.history().length;
  // He takes a draw when he is not better; he plays on when he is.
  var accepts = plies >= OFFER_MIN_PLIES && oppWinPct < 45;
  setStatus('You offered a draw…');
  setTimeout(function () {
    if (over) return;
    if (accepts) {
      endGame('draw-agreed');
    } else {
      setStatus(opp.name + ' declines the draw. Your move.');
    }
  }, 700 + Math.random() * 500);
}

// Called after each of his moves, with his own read of his chances.
function maybeOfferResignation() {
  if (over || resignOffered) return;
  oppLostStreak = oppWinPct <= RESIGN_AT ? oppLostStreak + 1 : 0;
  if (oppLostStreak < RESIGN_STREAK) return;
  if (game.history().length < OFFER_MIN_PLIES) return;
  if (game.turn() !== playerColor) return;
  resignOffered = true;
  showOffer(
    opp.name + ' wants to resign',
    '“I want to resign.” Accept and the win is yours, or decline and play it out.',
    function () { endGame('resign-opp'); },
    function () { setStatus(opp.name + ' plays on. Your move.'); }
  );
}

function useTakeback() {
  if (tbLeft === 0 || over || game.turn() !== playerColor || aiTimer || coachBusy) return;
  if (game.history().length < 2) return;
  game.undo();
  game.undo();
  tbLeft--;
  selected = null;
  clearHints();
  rebuildPieces();
  setMarks();
  renderPips();
  saveGame();
  setStatus('Took back your last move.');
}

// ---------- Game flow ----------
function setStatus(t) {
  var s = $('status');
  s.classList.remove('coach');
  s.textContent = t;
}

// ---------- Stockfish ----------
// Engine runs in stockfish.worker.js; nothing here blocks the main thread.
// Every request carries a timeout so a hung worker can never freeze the board.
var SF = (function () {
  var worker = null, nextId = 1, pending = {}, initPromise = null, queue = Promise.resolve();
  var info = { engine: null, threads: 0 };

  function ensureWorker() {
    if (worker) return;
    worker = new Worker('stockfish.worker.js');
    worker.onmessage = function (e) {
      var m = e.data || {};
      var p = pending[m.id];
      if (!p) return;
      delete pending[m.id];
      clearTimeout(p.timer);
      if (m.ok) p.resolve(m); else p.reject(new Error(m.error || 'engine error'));
    };
    worker.onerror = function (e) {
      var err = new Error(e.message || 'engine worker crashed');
      Object.keys(pending).forEach(function (id) {
        clearTimeout(pending[id].timer);
        pending[id].reject(err);
        delete pending[id];
      });
      try { worker.terminate(); } catch (ignore) {}
      worker = null;
      initPromise = null;
    };
  }

  function call(msg, timeoutMs) {
    ensureWorker();
    return new Promise(function (resolve, reject) {
      var id = nextId++;
      msg.id = id;
      pending[id] = {
        resolve: resolve,
        reject: reject,
        timer: setTimeout(function () {
          delete pending[id];
          if (worker) worker.postMessage({ cmd: 'abort', id: id });
          reject(new Error(msg.cmd + ' timed out'));
        }, timeoutMs)
      };
      worker.postMessage(msg);
    });
  }

  // Resolves after the UCI handshake (uciok then readyok) completes in the worker.
  function init() {
    if (!initPromise) {
      initPromise = call({ cmd: 'init' }, 60000).then(function (m) {
        info.engine = m.engine;
        info.threads = m.threads;
        return info;
      }, function (err) {
        initPromise = null;
        throw err;
      });
    }
    return initPromise;
  }

  // analyse(fen, {depth, multipv, timeout}) -> {bestmove, ponder, pvs, timeMs}
  // pvs: [{multipv, move, cp, mate, line, depth}], scores from the side to move.
  // Calls are serialised: the engine searches one position at a time.
  function analyse(fen, opts) {
    opts = opts || {};
    var job = queue.then(function () {
      return init().then(function () {
        return call({
          cmd: 'analyse',
          fen: fen,
          depth: opts.depth || 12,
          multipv: opts.multipv || 1
        }, opts.timeout || 120000);
      });
    });
    queue = job.then(function () {}, function () {});
    return job;
  }

  return { init: init, analyse: analyse, info: info };
})();

// ---------- Neural-net engines ----------
// Each net runs in its own worker (ONNX, off the main thread) and is
// cached in IndexedDB after first download. Same worker protocol for both.
function makeNetEngine(workerFile, modelUrl, modelVersion) {
  var worker = null, nextId = 1, pending = {}, readyPromise = null;
  var statusCb = null, progressCb = null;

  function ensureWorker() {
    if (worker) return;
    worker = new Worker(workerFile);
    worker.onmessage = function (e) {
      var m = e.data || {};
      if (m.type === 'status') {
        if (m.status === 'no-cache') worker.postMessage({ type: 'download' });
        if (m.status === 'ready' && readyPromise && readyPromise.resolve) readyPromise.resolve();
        if (statusCb) statusCb(m.status);
      }
      if (m.type === 'progress' && progressCb) progressCb(m.progress);
      if (m.type === 'eval-result' || (m.type === 'error' && m.id !== undefined)) {
        var p = pending[m.id];
        if (!p) return;
        delete pending[m.id];
        clearTimeout(p.timer);
        if (m.type === 'eval-result') p.resolve(m); else p.reject(new Error(m.message));
      } else if (m.type === 'error') {
        if (readyPromise && readyPromise.reject) readyPromise.reject(new Error(m.message));
      }
    };
    worker.onerror = function (e) {
      var err = new Error(e.message || 'maia worker crashed');
      if (readyPromise && readyPromise.reject) readyPromise.reject(err);
      Object.keys(pending).forEach(function (id) {
        clearTimeout(pending[id].timer);
        pending[id].reject(err);
        delete pending[id];
      });
      try { worker.terminate(); } catch (ignore) {}
      worker = null;
      readyPromise = null;
    };
  }

  // init(onStatus, onProgress) resolves when the model is loaded,
  // downloading it (with progress callbacks) if it isn't cached yet.
  // Later calls refresh the callbacks; a failed init can be retried.
  function init(onStatus, onProgress) {
    if (onStatus) statusCb = onStatus;
    if (onProgress) progressCb = onProgress;
    if (readyPromise) return readyPromise.promise;
    ensureWorker();
    var box = {};
    box.promise = new Promise(function (resolve, reject) {
      box.resolve = resolve;
      box.reject = reject;
      worker.postMessage({
        type: 'init',
        modelUrl: modelUrl,
        modelVersion: modelVersion
      });
      setTimeout(function () { reject(new Error('model load timed out')); }, 300000);
    });
    box.promise = box.promise.catch(function (err) {
      readyPromise = null;   // allow a retry
      throw err;
    });
    readyPromise = box;
    return box.promise;
  }

  // evaluate(fen, eloSelf, eloOppo) -> {moves: [[uci, prob], ...] sorted, value}
  function evaluate(fen, eloSelf, eloOppo) {
    return new Promise(function (resolve, reject) {
      var id = nextId++;
      pending[id] = {
        resolve: resolve,
        reject: reject,
        timer: setTimeout(function () {
          delete pending[id];
          reject(new Error('maia eval timed out'));
        }, 30000)
      };
      worker.postMessage({ type: 'eval', id: id, fen: fen, eloSelf: eloSelf, eloOppo: eloOppo });
    });
  }

  return { init: init, evaluate: evaluate };
}

var MAIA = makeNetEngine('maia.worker.js', 'models/maia3_simplified.onnx', '3');
var ANAND = makeNetEngine('anand.worker.js', 'models/meangirl-8.onnx', '1');

function startGame(o, idx, resume) {
  opp = o; oppIndex = idx;
  game = new Chess();
  over = false; selected = null;
  coachLeft = 3; tbLeft = 3;
  playerColor = resume ? resume.color : chosenColor;
  oppColor = playerColor === 'w' ? 'b' : 'w';
  resignOffered = false; oppLostStreak = 0; oppWinPct = 50;
  if (resume) {
    // replay the saved moves; anything illegal means a stale record
    for (var ri = 0; ri < resume.sans.length; ri++) {
      if (!game.move(resume.sans[ri])) break;
    }
    coachLeft = resume.coachLeft;
    tbLeft = resume.tbLeft;
    resignOffered = !!resume.resignOffered;
  }
  if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; }
  aiMoveSeq++;
  // Start fetching this opponent's net now (visible progress) so it's
  // ready by move one; then quietly prefetch the other net.
  var other = o.offLadder ? MAIA : ANAND;
  oppEngine().init(netLoadStatus, netLoadProgress).then(function () {
    if (game.history().length === 0 && !over) setStatus(openingStatus());
    other.init(function () {}, function () {}).catch(function () {});
  }).catch(function () {});
  $('oppName').textContent = o.name;
  $('oppRt').textContent = o.rating;
  $('ladder').classList.add('hidden');
  $('gameScr').classList.remove('hidden');
  $('card').classList.add('hidden');
  $('offer').classList.add('hidden');
  rebuildPieces();
  setMarks();
  clearHints();
  renderPips();
  renderTabs();
  setStatus(game.history().length
    ? (game.in_check() ? 'Check! Your move.' : 'Your move.')
    : openingStatus());
  saveGame();
  // He opens when you are Black, and takes his turn again on resume.
  if (game.turn() === oppColor) {
    setStatus(opp.name + ' is thinking…');
    aiTimer = setTimeout(aiMove, 500 + Math.random() * 400);
  }
}

// ---------- Unfinished game ----------
// The game in progress is written on every move so closing the tab, or
// stepping back to the ladder, leaves it waiting rather than lost.
var GAME_KEY = 'current-game';
var pendingGame = null;

function saveGame() {
  if (!game || over || !opp) return;
  pendingGame = {
    id: GAME_KEY,
    sans: game.history(),
    oppIndex: oppIndex,
    oppName: opp.name,
    color: playerColor,
    coachLeft: coachLeft,
    tbLeft: tbLeft,
    resignOffered: resignOffered
  };
  idbPut(pendingGame).catch(function () {});
}

function clearSavedGame() {
  pendingGame = null;
  idbDelete(GAME_KEY).catch(function () {});
}

function loadGame() {
  return idbGet(GAME_KEY).then(function (rec) {
    if (rec && rec.sans && rec.sans.length &&
        (rec.oppIndex === -1 || LEVELS[rec.oppIndex])) {
      pendingGame = rec;
    }
  }).catch(function () {});
}

function resumeGame() {
  if (!pendingGame) return;
  var o = pendingGame.oppIndex >= 0 ? LEVELS[pendingGame.oppIndex] : MEAN_GIRL;
  if (o) startGame(o, pendingGame.oppIndex, pendingGame);
}

function openingStatus() {
  return playerColor === 'w'
    ? 'Your move — you play White.'
    : 'You play Black — ' + opp.name + ' opens.';
}

// reason: undefined (played out), 'resign-player', 'resign-opp', 'draw-agreed'
function endGame(reason) {
  over = true;
  if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; }
  aiMoveSeq++;
  $('offer').classList.add('hidden');

  var result;
  if (reason === 'resign-player') result = 'loss';
  else if (reason === 'resign-opp') result = 'win';
  else if (reason === 'draw-agreed') result = 'draw';
  else if (game.in_checkmate()) result = game.turn() === oppColor ? 'win' : 'loss';
  else result = 'draw';

  lastGameRec = {
    sans: game.history(),
    opp: opp.name,
    result: result,
    color: playerColor
  };

  var title, msg;
  if (reason === 'resign-player') title = 'You resigned';
  else if (reason === 'resign-opp') title = opp.name + ' resigned';
  else if (reason === 'draw-agreed') title = 'Draw agreed';
  else if (game.in_checkmate()) title = 'Checkmate';
  else title = 'Draw';

  if (result === 'win') {
    msg = reason === 'resign-opp'
      ? opp.name + ' (' + opp.rating + ') resigned — the win is yours.'
      : 'You beat ' + opp.name + ' (' + opp.rating + ')!';
    if (opp.offLadder) {
      msg += ' Anand’s not on the ladder — bragging rights only.';
    } else if (oppIndex === progress) {
      progress++;
      saveState();
      msg += progress < LEVELS.length
        ? ' ' + LEVELS[progress].name + ' (' + LEVELS[progress].rating + ') is now unlocked.'
        : ' You’ve cleared the whole ladder!';
    }
  } else if (result === 'loss') {
    msg = reason === 'resign-player'
      ? 'You resigned against ' + opp.name + '. Have another go.'
      : opp.name + ' beat you. Have another go.';
  } else {
    msg = 'The game against ' + opp.name + ' ended in a draw.';
  }

  clearSavedGame();
  $('cardTitle').textContent = title;
  $('cardMsg').textContent = msg;
  $('card').classList.remove('hidden');
  renderTabs();
  setStatus('');
}

function toLadder() {
  if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; }
  aiMoveSeq++;
  $('gameScr').classList.add('hidden');
  $('card').classList.add('hidden');
  $('reviewScr').classList.add('hidden');
  $('ladder').classList.remove('hidden');
  $('resumeBtn').classList.toggle('hidden', !pendingGame);
  $('resumeOpp').textContent = pendingGame ? 'vs ' + pendingGame.oppName : '';
  $('lastReviewBtn').classList.toggle('hidden', !lastGameRec);
  $('lastReviewOpp').textContent = lastGameRec ? 'vs ' + lastGameRec.opp : '';
  renderSpend();
  renderLadder();
}

// ---------- Wire up ----------
buildSquares();
renderThemes();
renderTiers();
renderLadder();
loadState();
$('buildTag').textContent = 'build ' + BUILD;
setTimeout(checkFresh, 2500);
var board = $('board');
board.addEventListener('pointerdown', onDown);
board.addEventListener('pointermove', onMove);
board.addEventListener('pointerup', onUp);
board.addEventListener('pointercancel', onUp);
$('back').onclick = toLadder;
$('ladderBtn').onclick = toLadder;
$('rematchBtn').onclick = function () { startGame(opp, oppIndex); };
$('coachBtn').onclick = useCoach;
$('tbBtn').onclick = useTakeback;
$('resumeBtn').onclick = resumeGame;
$('resignBtn').onclick = playerResign;
$('drawBtn').onclick = playerOfferDraw;
$('reviewBtn').onclick = startReview;
$('lastReviewBtn').onclick = startReview;
$('rvBack').onclick = rvBackToLadder;
$('rvMoves').addEventListener('click', function (e) {
  var t = e.target.closest ? e.target.closest('[data-ply]') : null;
  if (!t) return;
  rvSelected = parseInt(t.getAttribute('data-ply'), 10);
  renderReview();
});
</script>
