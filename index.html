<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Anand Chess Club</title>
<!-- Cross-origin isolation shim: GitHub Pages can't send COOP/COEP headers, and
     Stockfish needs them for WASM threads. Reloads the page once on first visit. -->
<script src="coi-serviceworker.js"></script>
<style>
  :root { --brass: #C08A3E; }
  body[data-theme="slate"] {
    --bg:#14171C; --dark:#55606E; --light:#D8CEBD;
    --pw:#F0E9DC; --pb:#262B33; --pb-line:rgba(255,255,255,.20);
  }
  body[data-theme="dusk"] {
    --bg:#1C212A; --dark:#5A6472; --light:#AFAA9C;
    --pw:#D6D2C8; --pb:#272C35; --pb-line:rgba(255,255,255,.18);
  }
  body[data-theme="night"] {
    --bg:#08090B; --dark:#000000; --light:#474C53;
    --pw:#B2AEA6; --pb:#2E3238; --pb-line:rgba(178,174,166,.75);
  }
  body[data-theme="sage"] {
    --bg:#1E241F; --dark:#5B6A5C; --light:#AFB39F;
    --pw:#D5D6C7; --pb:#29312A; --pb-line:rgba(255,255,255,.18);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; }
  body {
    background: var(--bg);
    color: var(--pw);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  .hidden { display: none !important; }
  button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }

  /* ---------- Ladder screen ---------- */
  #ladder { max-width: 520px; margin: 0 auto; padding: 16px 16px 40px; }
  .themes { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; }
  .chip {
    padding: 5px 12px; border-radius: 999px; font-size: 13px;
    border: 1px solid color-mix(in srgb, var(--pw) 25%, transparent);
    color: color-mix(in srgb, var(--pw) 70%, transparent);
  }
  .chip.on { border-color: var(--brass); color: var(--brass); }
  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 26px; text-align: center; margin: 0 0 4px; letter-spacing: .02em;
  }
  .sub {
    text-align: center; margin: 0 0 22px; font-size: 14px; font-style: italic;
    color: color-mix(in srgb, var(--pw) 60%, transparent);
  }
  .row {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 12px 14px; margin-bottom: 8px; border-radius: 10px; text-align: left;
    border: 1.5px solid color-mix(in srgb, var(--pw) 12%, transparent);
    background: color-mix(in srgb, var(--pw) 4%, transparent);
  }
  .row .nm { flex: 1; font-size: 16px; }
  .row .rt { font-size: 13px; color: color-mix(in srgb, var(--pw) 55%, transparent); font-variant-numeric: tabular-nums; }
  .row .st { font-size: 13px; }
  .row.beaten { opacity: .45; }
  .row.beaten .st { color: var(--brass); }
  .row.current { border-color: var(--brass); }
  .row.locked { opacity: .28; cursor: default; }
  .row.mg { border-color: #B84A4A; }
  .divider {
    display: flex; align-items: center; gap: 10px; margin: 20px 0 12px;
    font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    color: color-mix(in srgb, var(--pw) 45%, transparent);
  }
  .divider::before, .divider::after {
    content: ""; flex: 1; height: 1px;
    background: color-mix(in srgb, var(--pw) 15%, transparent);
  }

  /* ---------- Game screen ---------- */
  #gameScr { max-width: 520px; margin: 0 auto; padding: 10px 0 24px; }
  .topbar { display: flex; align-items: center; padding: 0 12px 8px; }
  #back { font-size: 22px; padding: 4px 14px 4px 4px; color: var(--brass); }
  .who { flex: 1; text-align: center; }
  .who .nm { font-size: 16px; }
  .who .rt { font-size: 13px; margin-left: 6px; color: color-mix(in srgb, var(--pw) 55%, transparent); }
  .topbar .sp { width: 40px; }
  .tools { display: flex; flex-direction: column; gap: 6px; padding: 10px 16px 0; }
  .tool {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 12px; border-radius: 8px; font-size: 14px;
    border: 1px solid color-mix(in srgb, var(--pw) 15%, transparent);
  }
  .tool:disabled { opacity: .4; cursor: default; }
  .pips { display: flex; gap: 6px; }
  .pip { width: 9px; height: 9px; border-radius: 50%; background: var(--brass); }
  .pip.spent { opacity: .22; }

  #board {
    position: relative; width: 100%; aspect-ratio: 1;
    touch-action: none; container-type: inline-size;
  }
  #squares, #marks, #pieces, #hints { position: absolute; inset: 0; }
  #marks, #hints { pointer-events: none; }
  #pieces { pointer-events: none; }
  .sq, .mark, .hint, .piece { position: absolute; width: 12.5%; height: 12.5%; }
  .sq.l { background: var(--light); }
  .sq.d { background: var(--dark); }
  .mark.last { background: rgba(192,138,62,.28); }
  .mark.sel  { box-shadow: inset 0 0 0 2px var(--brass); }
  .mark.chk  { background: radial-gradient(circle, rgba(205,62,50,.6), rgba(205,62,50,0) 72%); }
  .piece {
    display: flex; align-items: center; justify-content: center;
    font-size: 6vw; font-size: 9.5cqi; line-height: 1;
    transition: transform 140ms ease-out, opacity 120ms linear;
    will-change: transform;
  }
  .piece.w { color: var(--pw); text-shadow: 0 1px 2px rgba(0,0,0,.45); }
  .piece.b {
    color: var(--pb);
    text-shadow: -1px 0 0 var(--pb-line), 1px 0 0 var(--pb-line),
                 0 -1px 0 var(--pb-line), 0 1px 0 var(--pb-line);
  }
  .piece.drag { transition: none; z-index: 10; }
  .piece.gone { opacity: 0; }
  .piece > span { display: block; }
  .piece > span.shake { animation: shake 260ms ease-in-out; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-3px); }
    40% { transform: translateX(3px); }
    60% { transform: translateX(-2px); }
    80% { transform: translateX(2px); }
  }
  .hint::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
  }
  .hint.dot::after {
    inset: 36%; background: color-mix(in srgb, var(--brass) 65%, transparent);
  }
  .hint.ring::after {
    inset: 7%; border: 3px solid color-mix(in srgb, var(--brass) 70%, transparent);
  }
  #status {
    min-height: 22px; text-align: center; padding: 12px 16px 0; font-size: 14px;
    color: color-mix(in srgb, var(--pw) 70%, transparent);
  }
  #status.coach { text-align: left; white-space: pre-line; }
  #status.coach .voice { color: #5B9BD5; }

  /* ---------- End card ---------- */
  #card {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.55); z-index: 50; padding: 24px;
  }
  .cardbox {
    background: var(--bg); border: 1.5px solid var(--brass); border-radius: 14px;
    padding: 26px 24px; max-width: 340px; width: 100%; text-align: center;
  }
  .cardbox h2 { font-family: Georgia, serif; margin: 0 0 8px; font-size: 22px; }
  .cardbox p { margin: 0 0 18px; font-size: 14px; color: color-mix(in srgb, var(--pw) 75%, transparent); }
  .cardbox .btns { display: flex; gap: 10px; justify-content: center; }
  .cardbox .btns button {
    padding: 8px 16px; border-radius: 8px; font-size: 14px;
    border: 1px solid color-mix(in srgb, var(--pw) 30%, transparent);
  }
  .cardbox .btns button.primary { border-color: var(--brass); color: var(--brass); }

  @media (prefers-reduced-motion: reduce) {
    .piece { transition: none; }
    .piece > span.shake { animation: none; }
  }
</style>
</head>
<body data-theme="dusk">

<section id="ladder">
  <div class="themes" id="themes"></div>
  <h1>Anand Chess Club</h1>
  <p class="sub">Beat a member to meet the next one.</p>
  <div id="rows"></div>
</section>

<section id="gameScr" class="hidden">
  <div class="topbar">
    <button id="back" aria-label="Back to ladder">&#8249;</button>
    <div class="who"><span class="nm" id="oppName"></span><span class="rt" id="oppRt"></span></div>
    <div class="sp"></div>
  </div>
  <div id="board">
    <div id="squares"></div>
    <div id="marks"></div>
    <div id="pieces"></div>
    <div id="hints"></div>
  </div>
  <div class="tools">
    <button class="tool" id="coachBtn">Coach <span class="pips" id="coachPips"></span></button>
    <button class="tool" id="tbBtn">Takeback <span class="pips" id="tbPips"></span></button>
  </div>
  <div id="status"></div>
</section>

<div id="card" class="hidden">
  <div class="cardbox">
    <h2 id="cardTitle"></h2>
    <p id="cardMsg"></p>
    <div class="btns">
      <button id="rematchBtn">Rematch</button>
      <button id="ladderBtn" class="primary">Back to ladder</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
'use strict';

// ---------- Data (all state lives in memory only) ----------
var LEVELS = [
  { name: 'The New Kid',     rating: 700 },
  { name: 'Coffee House',    rating: 800 },
  { name: 'Book Learner',    rating: 900 },
  { name: 'Tactics Grinder', rating: 1000 },
  { name: 'Weekend Warrior', rating: 1100 },
  { name: 'Club Regular',    rating: 1200 },
  { name: 'Board One',       rating: 1300 },
  { name: 'The Ringer',      rating: 1400 },
  { name: 'Prize Winner',    rating: 1600 },
  { name: 'The Champion',    rating: 1900 }
];
var MEAN_GIRL = { name: 'Anand', rating: 2400, offLadder: true };
var THEMES = ['slate', 'dusk', 'night', 'sage'];
var GLYPH = { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' };
var progress = 0;          // ladder levels beaten (memory only)
var game = null;           // chess.js instance
var opp = null;            // current opponent
var oppIndex = -1;         // ladder index, -1 for Mean Girl
var pieceEls = {};         // square -> piece element
var selected = null;
var aiTimer = null;
var over = false;
var coachLeft = 3, tbLeft = 3;

var $ = function (id) { return document.getElementById(id); };
var FILES = 'abcdefgh';

function buzz() { if (navigator.vibrate) navigator.vibrate(10); }

// ---------- Themes ----------
function renderThemes() {
  var box = $('themes');
  box.innerHTML = '';
  THEMES.forEach(function (t) {
    var b = document.createElement('button');
    b.className = 'chip' + (document.body.dataset.theme === t ? ' on' : '');
    b.textContent = t.charAt(0).toUpperCase() + t.slice(1);
    b.onclick = function () { document.body.dataset.theme = t; renderThemes(); };
    box.appendChild(b);
  });
}

// ---------- Ladder ----------
function renderLadder() {
  var box = $('rows');
  box.innerHTML = '';
  LEVELS.forEach(function (lv, i) {
    var b = document.createElement('button');
    var state = i < progress ? 'beaten' : (i === progress ? 'current' : 'locked');
    b.className = 'row ' + state;
    b.innerHTML = '<span class="nm">' + lv.name + '</span>' +
                  '<span class="rt">' + lv.rating + '</span>' +
                  '<span class="st">' + (state === 'beaten' ? '✓' : (state === 'locked' ? 'Locked' : '')) + '</span>';
    if (state !== 'locked') b.onclick = function () { startGame(lv, i); };
    else b.disabled = true;
    box.appendChild(b);
  });
  var div = document.createElement('div');
  div.className = 'divider';
  div.innerHTML = '<span>Not on the ladder</span>';
  box.appendChild(div);
  var mg = document.createElement('button');
  mg.className = 'row mg';
  mg.innerHTML = '<span class="nm">' + MEAN_GIRL.name + '</span>' +
                 '<span class="rt">' + MEAN_GIRL.rating + '</span><span class="st"></span>';
  mg.onclick = function () { startGame(MEAN_GIRL, -1); };
  box.appendChild(mg);
}

// ---------- Board setup ----------
function sqName(f, r) { return FILES[f] + (8 - r); }           // f,r are 0-7 from top-left
function coords(sq) { return { f: FILES.indexOf(sq[0]), r: 8 - parseInt(sq[1], 10) }; }
function place(el, sq) {
  var c = coords(sq);
  el.style.transform = 'translate(' + (c.f * 100) + '%, ' + (c.r * 100) + '%)';
  el.dataset.square = sq;
}

function buildSquares() {
  var box = $('squares');
  box.innerHTML = '';
  for (var r = 0; r < 8; r++) for (var f = 0; f < 8; f++) {
    var d = document.createElement('div');
    d.className = 'sq ' + ((f + r) % 2 === 0 ? 'l' : 'd');
    d.style.transform = 'translate(' + (f * 100) + '%, ' + (r * 100) + '%)';
    box.appendChild(d);
  }
}

function rebuildPieces() {
  var box = $('pieces');
  box.innerHTML = '';
  pieceEls = {};
  var rows = game.board();
  for (var r = 0; r < 8; r++) for (var f = 0; f < 8; f++) {
    var pc = rows[r][f];
    if (!pc) continue;
    var el = document.createElement('div');
    el.className = 'piece ' + pc.color;
    el.innerHTML = '<span>' + GLYPH[pc.type] + '</span>';
    place(el, sqName(f, r));
    box.appendChild(el);
    pieceEls[sqName(f, r)] = el;
  }
}

// ---------- Marks & hints ----------
function setMarks() {
  var box = $('marks');
  box.innerHTML = '';
  var hist = game.history({ verbose: true });
  var last = hist[hist.length - 1];
  if (last) [last.from, last.to].forEach(function (sq) {
    var m = document.createElement('div');
    m.className = 'mark last';
    place(m, sq);
    box.appendChild(m);
  });
  if (selected) {
    var s = document.createElement('div');
    s.className = 'mark sel';
    place(s, selected);
    box.appendChild(s);
  }
  if (game.in_check()) {
    var side = game.turn();
    var rows = game.board();
    for (var r = 0; r < 8; r++) for (var f = 0; f < 8; f++) {
      var pc = rows[r][f];
      if (pc && pc.type === 'k' && pc.color === side) {
        var k = document.createElement('div');
        k.className = 'mark chk';
        place(k, sqName(f, r));
        box.appendChild(k);
      }
    }
  }
}

function showHints(sq) {
  var box = $('hints');
  box.innerHTML = '';
  game.moves({ square: sq, verbose: true }).forEach(function (m) {
    var h = document.createElement('div');
    h.className = 'hint ' + (m.captured ? 'ring' : 'dot');
    place(h, m.to);
    box.appendChild(h);
  });
}
function clearHints() { $('hints').innerHTML = ''; }

// ---------- Moves ----------
function animateMove(mv) {
  var el = pieceEls[mv.from];
  if (!el) { rebuildPieces(); return; }
  delete pieceEls[mv.from];

  var capSq = mv.to;
  if (mv.flags.indexOf('e') !== -1) capSq = mv.to[0] + mv.from[1];  // en passant
  if (mv.captured && pieceEls[capSq]) {
    var dead = pieceEls[capSq];
    delete pieceEls[capSq];
    dead.classList.add('gone');
    setTimeout(function () { dead.remove(); }, 150);
  }

  place(el, mv.to);
  pieceEls[mv.to] = el;
  if (mv.promotion) el.firstChild.textContent = GLYPH[mv.promotion];

  if (mv.flags.indexOf('k') !== -1 || mv.flags.indexOf('q') !== -1) {  // castling: move the rook
    var rank = mv.from[1];
    var rf = mv.flags.indexOf('k') !== -1 ? 'h' + rank : 'a' + rank;
    var rt = mv.flags.indexOf('k') !== -1 ? 'f' + rank : 'd' + rank;
    var rook = pieceEls[rf];
    if (rook) { delete pieceEls[rf]; place(rook, rt); pieceEls[rt] = rook; }
  }
}

function afterMove(mv) {
  selected = null;
  clearHints();
  setMarks();
  if (mv.captured || game.in_check()) buzz();
  if (game.game_over()) { endGame(); return; }
  if (game.turn() === 'b') {
    setStatus(opp.name + ' is thinking…');
    aiTimer = setTimeout(aiMove, 350 + Math.random() * 400);
  } else {
    setStatus(game.in_check() ? 'Check! Your move.' : 'Your move.');
  }
}

function tryPlayerMove(from, to) {
  var mv = game.move({ from: from, to: to, promotion: 'q' });
  if (!mv) return false;
  animateMove(mv);
  afterMove(mv);
  return true;
}

// ---------- Maia opponent ----------
// The net's policy is the move choice — no search (it would destroy the
// human-like play). Variety comes from temperature + nucleus (top-p)
// sampling over the policy, applied to the whole game, mirroring the
// Temperature/TopP controls of the Maia 3 UCI engine.
// Maia is calibrated to reproduce human play, so it samples its policy
// as-is (T=1). Anand's net is not a human model — sampling it at 1.0
// just adds noise (early h-pawn pushes were 0.8% tail moves), so he
// plays close to argmax with only top-move-level variety.
var MAIA_TEMPERATURE = 1.0;   // ladder: the human distribution, unmodified
var ANAND_TEMPERATURE = 0.3;  // Anand: sharp; ~90% top move, tail crushed
var MAIA_TOP_P = 1.0;         // 1 = disabled (no tail cut)
var PLAYER_ELO = 1000;        // fed as elo_oppo (rough player strength)
var aiMoveSeq = 0;            // invalidates in-flight evals on new game / takeback

function chooseMaiaMove(moves, temperature) {
  if (temperature <= 0) return moves[0][0];
  // Nucleus: smallest prefix of the sorted policy with mass >= MAIA_TOP_P.
  var nucleus = [];
  var mass = 0;
  for (var i = 0; i < moves.length; i++) {
    nucleus.push(moves[i]);
    mass += moves[i][1];
    if (mass >= MAIA_TOP_P) break;
  }
  // Temperature: p^(1/T), renormalised, then sample.
  var sum = 0;
  var weights = nucleus.map(function (m) {
    var w = Math.pow(m[1], 1 / temperature);
    sum += w;
    return w;
  });
  var r = Math.random() * sum;
  for (var j = 0; j < nucleus.length; j++) {
    r -= weights[j];
    if (r <= 0) return nucleus[j][0];
  }
  return nucleus[nucleus.length - 1][0];
}

function oppEngine() { return opp && opp.offLadder ? ANAND : MAIA; }

function aiMove() {
  aiTimer = null;
  if (over) return;
  var seq = ++aiMoveSeq;
  var engine = oppEngine();
  var t0 = performance.now();
  engine.init(netLoadStatus, netLoadProgress).then(function () {
    return engine.evaluate(game.fen(), opp.rating, PLAYER_ELO);
  }).then(function (r) {
    if (over || seq !== aiMoveSeq || game.turn() !== 'b' || !r.moves.length) return;
    var uci = chooseMaiaMove(r.moves, opp.offLadder ? ANAND_TEMPERATURE : MAIA_TEMPERATURE);
    // keep a touch of think time so instant cached replies still feel human
    var delay = Math.max(0, 400 + Math.random() * 500 - (performance.now() - t0));
    setTimeout(function () {
      if (over || seq !== aiMoveSeq || game.turn() !== 'b') return;
      var mv = game.move({
        from: uci.slice(0, 2),
        to: uci.slice(2, 4),
        promotion: uci.length > 4 ? uci.slice(4) : undefined
      });
      if (!mv) mv = game.move(game.moves()[0]);  // should never happen
      animateMove(mv);
      afterMove(mv);
    }, delay);
  }).catch(function (err) {
    if (seq !== aiMoveSeq) return;
    setStatus(netLabel() + ': ' + err.message + ' — retrying…');
    aiTimer = setTimeout(aiMove, 3000);
  });
}

// Status-line updates while a model loads mid-game.
function netLabel() { return opp && opp.offLadder ? 'Anand' : 'Maia'; }
function netSize() { return opp && opp.offLadder ? '2MB' : '46MB'; }
function netLoadStatus(status) {
  if (status === 'downloading') setStatus('Downloading ' + netLabel() + ' (' + netSize() + ')…');
}
function netLoadProgress(progress) {
  setStatus('Downloading ' + netLabel() + ' (' + netSize() + ')… ' + progress + '%');
}

// ---------- Input: tap and drag ----------
var dragEl = null, dragFrom = null, dragging = false, downPt = null, wasSelected = false;

function squareAt(e) {
  var rect = $('board').getBoundingClientRect();
  var f = Math.floor((e.clientX - rect.left) / rect.width * 8);
  var r = Math.floor((e.clientY - rect.top) / rect.height * 8);
  if (f < 0 || f > 7 || r < 0 || r > 7) return null;
  return sqName(f, r);
}

function playerCanMove() { return !over && game && game.turn() === 'w' && !aiTimer; }

function springBack(el, from) {
  el.classList.remove('drag');
  place(el, from);
  var span = el.firstChild;
  span.classList.remove('shake');
  void span.offsetWidth;
  span.classList.add('shake');
  setTimeout(function () { span.classList.remove('shake'); }, 300);
}

function onDown(e) {
  if (!playerCanMove()) return;
  e.preventDefault();
  var sq = squareAt(e);
  if (!sq) return;
  var pc = game.get(sq);
  if (pc && pc.color === 'w') {
    wasSelected = (selected === sq);
    selected = sq;
    showHints(sq);
    setMarks();
    dragEl = pieceEls[sq];
    dragFrom = sq;
    dragging = false;
    downPt = { x: e.clientX, y: e.clientY };
    $('board').setPointerCapture(e.pointerId);
  } else if (selected) {
    if (!tryPlayerMove(selected, sq)) {
      selected = null;
      clearHints();
      setMarks();
    }
  }
}

function onMove(e) {
  if (!dragEl || !downPt) return;
  if (!dragging) {
    var dx = e.clientX - downPt.x, dy = e.clientY - downPt.y;
    if (dx * dx + dy * dy < 36) return;
    dragging = true;
    dragEl.classList.add('drag');
  }
  var rect = $('board').getBoundingClientRect();
  var s = rect.width / 8;
  var x = Math.min(Math.max(e.clientX - rect.left - s / 2, -s / 2), rect.width - s / 2);
  var y = Math.min(Math.max(e.clientY - rect.top - s / 2, -s / 2), rect.height - s / 2);
  dragEl.style.transform = 'translate(' + x + 'px, ' + y + 'px)';
}

function onUp(e) {
  if (!dragEl) return;
  var el = dragEl, from = dragFrom;
  dragEl = null; downPt = null;
  if (dragging) {
    dragging = false;
    el.classList.remove('drag');             // restore transition so the snap glides
    var to = squareAt(e);
    if (to === from) {                       // dropped back home: no move attempted
      place(el, from);
    } else if (!to || !tryPlayerMove(from, to)) {
      springBack(el, from);
      selected = null; clearHints(); setMarks();
    }
  } else if (wasSelected) {          // tapped the already-selected piece: deselect
    selected = null;
    clearHints();
    setMarks();
  }
}

// ---------- Coach & takeback ----------
function renderPips() {
  [['coachPips', coachLeft], ['tbPips', tbLeft]].forEach(function (p) {
    var box = $(p[0]);
    box.innerHTML = '';
    for (var i = 0; i < 3; i++) {
      var d = document.createElement('span');
      d.className = 'pip' + (i >= p[1] ? ' spent' : '');
      box.appendChild(d);
    }
  });
  $('coachBtn').disabled = coachLeft === 0;
  $('tbBtn').disabled = tbLeft === 0;
}

// ---------- Coach ----------
// One tap, one pip: Stockfish (depth 18, MultiPV 3) is the authority;
// Anand's net proposes his sharper move; if they differ, his move is
// measured by Stockfish and the gap stated in win percentage. One Claude
// call writes both voices. Everything is cached by FEN.
var COACH_SYSTEM =
  'You explain chess to a beginner rated around 1000. Stockfish is the ' +
  'authority on what is true — you are only translating it. Never invent a ' +
  'move, line, or tactic that is not in the data given to you. No engine ' +
  'numbers in your answer. Two to three sentences per voice. Plain language.\n' +
  'Anand’s move has been measured by Stockfish. If it is worse, say plainly ' +
  'that it is worse and roughly what it costs. Never present a losing move as ' +
  'merely interesting.\n' +
  'Always be clear whose piece is whose; never call an opponent’s piece "yours".';

function winPct(cp) {
  return 50 + 50 * (2 / (1 + Math.exp(-0.00368208 * cp)) - 1);
}
function pvToCp(pv) {   // SF pv entry -> centipawns from the side to move
  if (!pv) return 0;
  if (pv.mate !== null && pv.mate !== undefined) return pv.mate > 0 ? 10000 : -10000;
  return pv.cp;
}

function sanLine(fen, ucis, maxPlies) {
  var g = new Chess(fen);
  var out = [];
  for (var i = 0; i < ucis.length && i < maxPlies; i++) {
    var u = ucis[i];
    var mv = g.move({ from: u.slice(0, 2), to: u.slice(2, 4), promotion: u.length > 4 ? u.slice(4) : undefined });
    if (!mv) break;
    out.push(mv.san);
  }
  return out.join(' ');
}
function sanOf(fen, uci) { return sanLine(fen, [uci], 1); }

// "White pieces: Kg1 Qd1 ... | Black pieces: ..." so ownership is explicit.
function pieceOwnership(fen) {
  var g = new Chess(fen);
  var order = { k: 0, q: 1, r: 2, b: 3, n: 4, p: 5 };
  var sides = { w: [], b: [] };
  'abcdefgh'.split('').forEach(function (f) {
    for (var r = 1; r <= 8; r++) {
      var sq = f + r;
      var pc = g.get(sq);
      if (pc) sides[pc.color].push({ t: pc.type, sq: sq });
    }
  });
  function fmt(list) {
    list.sort(function (a, b) { return order[a.t] - order[b.t]; });
    return list.map(function (p) {
      return (p.t === 'p' ? '' : p.t.toUpperCase()) + p.sq;
    }).join(' ');
  }
  return 'White pieces: ' + fmt(sides.w) + ' | Black pieces: ' + fmt(sides.b);
}

// -- device-local key + cache storage (same IndexedDB the models use) --
function idbOpen() {
  return new Promise(function (resolve, reject) {
    var req = indexedDB.open('MaiaModels', 1);
    req.onerror = function () { reject(req.error); };
    req.onsuccess = function () { resolve(req.result); };
    req.onupgradeneeded = function (e) {
      var db = e.target.result;
      if (!db.objectStoreNames.contains('models')) {
        db.createObjectStore('models', { keyPath: 'id' });
      }
    };
  });
}
function idbGet(id) {
  return idbOpen().then(function (db) {
    return new Promise(function (resolve, reject) {
      var req = db.transaction(['models'], 'readonly').objectStore('models').get(id);
      req.onsuccess = function () { resolve(req.result || null); };
      req.onerror = function () { reject(req.error); };
    });
  });
}
function idbPut(obj) {
  return idbOpen().then(function (db) {
    return new Promise(function (resolve, reject) {
      var req = db.transaction(['models'], 'readwrite').objectStore('models').put(obj);
      req.onsuccess = function () { resolve(); };
      req.onerror = function () { reject(req.error); };
    });
  });
}
function idbDelete(id) {
  return idbOpen().then(function (db) {
    return new Promise(function (resolve, reject) {
      var req = db.transaction(['models'], 'readwrite').objectStore('models').delete(id);
      req.onsuccess = function () { resolve(); };
      req.onerror = function () { reject(req.error); };
    });
  });
}

// Tag an error with the stage that produced it, so failures are never generic.
function stageErr(stage) {
  return function (err) {
    var msg = err && err.message ? err.message : 'unknown error';
    if (msg.lastIndexOf(stage, 0) === 0) throw err;   // already tagged
    throw new Error(stage + ' — ' + msg);
  };
}

function getCoachKey() {
  return idbGet('claude-api-key').catch(function (e) {
    throw new Error('Key storage (IndexedDB) unavailable — ' + (e && e.message ? e.message : e));
  }).then(function (rec) {
    if (rec && rec.key) return rec.key;
    var k = window.prompt('Paste your Claude API key for the Coach (kept only on this device):');
    if (k === null) throw new Error('No API key — the prompt was cancelled. Tap Coach to try again');
    if (!k.trim()) throw new Error('No API key — nothing was entered. Tap Coach to try again');
    k = k.trim();
    return idbPut({ id: 'claude-api-key', key: k }).catch(function () {}).then(function () { return k; });
  });
}

// -- engine work, cached by FEN --
var coachData = {};   // fen -> Promise of measured analysis
var coachText = {};   // fen -> successful Claude prose

function coachEngineData(fen) {
  if (coachData[fen]) return coachData[fen];
  var p = SF.init().catch(stageErr('Stockfish didn’t load')).then(function () {
    return Promise.all([
      SF.analyse(fen, { depth: 18, multipv: 3 }).catch(stageErr('Stockfish analysis failed')),
      ANAND.init().catch(stageErr('Anand’s net didn’t load')).then(function () {
        return ANAND.evaluate(fen).catch(stageErr('Anand’s net failed'));
      })
    ]);
  }).then(function (rs) {
    var sf = rs[0];
    var best = sf.pvs[0];
    if (!best) throw new Error('no line found');
    var d = {
      fen: fen,
      bestSan: sanOf(fen, sf.bestmove),
      bestLine: sanLine(fen, best.line.split(' '), 6),
      bestMate: best.mate,
      bestWin: winPct(pvToCp(best)),
      alts: sf.pvs.slice(1).map(function (pv) {
        return { san: sanOf(fen, pv.move), win: winPct(pvToCp(pv)) };
      }),
      anandUci: rs[1].moves[0][0]
    };
    d.anandSan = sanOf(fen, d.anandUci);
    d.agree = d.anandUci === sf.bestmove;
    if (d.agree) return d;
    // measure Anand's move: evaluate the position it leaves, same depth
    var g = new Chess(fen);
    g.move({
      from: d.anandUci.slice(0, 2),
      to: d.anandUci.slice(2, 4),
      promotion: d.anandUci.length > 4 ? d.anandUci.slice(4) : undefined
    });
    var childFen = g.fen();
    return SF.analyse(childFen, { depth: 18, multipv: 1 })
      .catch(stageErr('Stockfish check of Anand’s move failed'))
      .then(function (r2) {
      var reply = r2.pvs[0];
      d.anandWin = 100 - winPct(pvToCp(reply));   // child eval is opponent-to-move
      d.anandCost = d.bestWin - d.anandWin;
      d.anandLine = d.anandSan + (reply ? ' ' + sanLine(childFen, reply.line.split(' '), 5) : '');
      return d;
    });
  });
  p = p.catch(function (e) { delete coachData[fen]; throw e; });
  coachData[fen] = p;
  return p;
}

function coachPayload(d) {
  var lines = [];
  lines.push('Position (FEN): ' + d.fen);
  lines.push('The student you are coaching is WHITE. It is White to move. ' +
    'Black is the opponent — Black’s pieces are never "yours" or "the student’s".');
  lines.push(pieceOwnership(d.fen));
  lines.push('Stockfish, depth 18 (the authority):');
  lines.push('- Best move: ' + d.bestSan +
    ' | White win chance with best play: ' + d.bestWin.toFixed(1) + '%' +
    (d.bestMate ? ' | this line forces checkmate in ' + Math.abs(d.bestMate) : '') +
    ' | main line: ' + d.bestLine);
  d.alts.forEach(function (a) {
    lines.push('- Alternative: ' + a.san + ' (win chance ' + a.win.toFixed(1) + '%)');
  });
  if (d.agree) {
    lines.push('Anand’s suggestion: ' + d.anandSan + ' — the SAME move as Stockfish’s best.');
    lines.push('They agree. Reply with ONE short line saying the Computer and GM Anand ' +
      'both recommend ' + d.bestSan + ' and, in plain words, why it is good. ' +
      'Do not manufacture a disagreement. Call Stockfish "the Computer" and Anand "GM Anand".');
  } else {
    lines.push('Anand’s suggestion: ' + d.anandSan +
      ' | measured by Stockfish: White win chance ' + d.anandWin.toFixed(1) + '%, which is ' +
      d.anandCost.toFixed(1) + ' percentage points worse than the best move' +
      ' | line after it: ' + d.anandLine);
    lines.push('Reply with exactly two short paragraphs separated by a blank line, ' +
      'the first starting "Computer:" (the Stockfish voice) explaining the best move, ' +
      'the second starting "GM Anand:" pitching his suggestion in his sharp voice ' +
      'while stating plainly what it costs.');
  }
  return lines.join('\n');
}

function coachAsk(payload, key) {
  return fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-5',
      max_tokens: 400,
      system: COACH_SYSTEM,
      messages: [{ role: 'user', content: payload }]
    })
  }).catch(function (e) {
    // fetch itself failing = no response at all
    throw new Error('No internet — the Claude API could not be reached (' +
      (e && e.message ? e.message : e) + ')');
  }).then(function (res) {
    if (res.ok) return res.json();
    // pull the API's own explanation out of the error body when there is one
    return res.json().catch(function () { return {}; }).then(function (body) {
      var apiMsg = body && body.error && body.error.message ? ' — ' + body.error.message : '';
      if (res.status === 401 || res.status === 403) {
        return idbDelete('claude-api-key').catch(function () {}).then(function () {
          throw new Error('API key rejected' + apiMsg + ' — tap Coach to enter a new one');
        });
      }
      if (res.status === 429) {
        throw new Error('Claude API error 429 — rate limited or out of credits' + apiMsg);
      }
      throw new Error('Claude API error ' + res.status + apiMsg);
    });
  }).then(function (j) {
    var txt = (j.content || []).filter(function (c) { return c.type === 'text'; })
      .map(function (c) { return c.text; }).join(' ').trim();
    if (!txt) throw new Error('empty reply');
    return txt;
  });
}

var coachBusy = false;
var coachSpinTimer = null;
var COACH_DOTS = ['.', '..', '...'];

function coachSpinner(on) {
  if (coachSpinTimer) { clearInterval(coachSpinTimer); coachSpinTimer = null; }
  if (on) {
    var n = 0;
    setStatus('Coach is thinking.');
    coachSpinTimer = setInterval(function () {
      n = (n + 1) % 3;
      setStatus('Coach is thinking' + COACH_DOTS[n]);
    }, 400);
  }
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function coachShow(fen, text) {
  // don't clobber the status if the position moved on while we worked
  if (!over && game && game.fen() === fen) {
    var s = $('status');
    s.classList.add('coach');   // left-aligned, keeps blank lines
    s.innerHTML = escapeHtml(text)
      .replace(/^(Computer:|GM Anand:)/gm, '<span class="voice">$1</span>');
  }
}

function useCoach() {
  if (over || game.turn() !== 'w' || aiTimer || coachBusy) return;
  var fen = game.fen();
  if (coachText[fen]) { coachShow(fen, coachText[fen]); return; }   // cached: free
  if (coachLeft === 0) return;
  coachLeft--;
  renderPips();
  coachBusy = true;
  getCoachKey().then(function (key) {
    coachSpinner(true);
    return coachEngineData(fen).then(function (d) {
      return coachAsk(coachPayload(d), key).then(function (txt) {
        coachText[fen] = txt;
        coachSpinner(false);
        coachShow(fen, txt);
      }, function (apiErr) {
        // API failed: still show Stockfish's move, plus the real reason
        coachSpinner(false);
        coachShow(fen, 'Computer: ' + d.bestSan + '. (' + apiErr.message + ')');
      });
    });
  }).catch(function (err) {
    // nothing useful produced: refund the pip and say exactly what broke
    coachSpinner(false);
    coachLeft++;
    renderPips();
    coachShow(fen, 'Coach: ' + err.message);
  }).then(function () { coachBusy = false; });
}

function useTakeback() {
  if (tbLeft === 0 || over || game.turn() !== 'w' || aiTimer || coachBusy) return;
  if (game.history().length < 2) return;
  game.undo();
  game.undo();
  tbLeft--;
  selected = null;
  clearHints();
  rebuildPieces();
  setMarks();
  renderPips();
  setStatus('Took back your last move.');
}

// ---------- Game flow ----------
function setStatus(t) {
  var s = $('status');
  s.classList.remove('coach');
  s.textContent = t;
}

// ---------- Stockfish ----------
// Engine runs in stockfish.worker.js; nothing here blocks the main thread.
// Every request carries a timeout so a hung worker can never freeze the board.
var SF = (function () {
  var worker = null, nextId = 1, pending = {}, initPromise = null, queue = Promise.resolve();
  var info = { engine: null, threads: 0 };

  function ensureWorker() {
    if (worker) return;
    worker = new Worker('stockfish.worker.js');
    worker.onmessage = function (e) {
      var m = e.data || {};
      var p = pending[m.id];
      if (!p) return;
      delete pending[m.id];
      clearTimeout(p.timer);
      if (m.ok) p.resolve(m); else p.reject(new Error(m.error || 'engine error'));
    };
    worker.onerror = function (e) {
      var err = new Error(e.message || 'engine worker crashed');
      Object.keys(pending).forEach(function (id) {
        clearTimeout(pending[id].timer);
        pending[id].reject(err);
        delete pending[id];
      });
      try { worker.terminate(); } catch (ignore) {}
      worker = null;
      initPromise = null;
    };
  }

  function call(msg, timeoutMs) {
    ensureWorker();
    return new Promise(function (resolve, reject) {
      var id = nextId++;
      msg.id = id;
      pending[id] = {
        resolve: resolve,
        reject: reject,
        timer: setTimeout(function () {
          delete pending[id];
          if (worker) worker.postMessage({ cmd: 'abort', id: id });
          reject(new Error(msg.cmd + ' timed out'));
        }, timeoutMs)
      };
      worker.postMessage(msg);
    });
  }

  // Resolves after the UCI handshake (uciok then readyok) completes in the worker.
  function init() {
    if (!initPromise) {
      initPromise = call({ cmd: 'init' }, 60000).then(function (m) {
        info.engine = m.engine;
        info.threads = m.threads;
        return info;
      }, function (err) {
        initPromise = null;
        throw err;
      });
    }
    return initPromise;
  }

  // analyse(fen, {depth, multipv, timeout}) -> {bestmove, ponder, pvs, timeMs}
  // pvs: [{multipv, move, cp, mate, line, depth}], scores from the side to move.
  // Calls are serialised: the engine searches one position at a time.
  function analyse(fen, opts) {
    opts = opts || {};
    var job = queue.then(function () {
      return init().then(function () {
        return call({
          cmd: 'analyse',
          fen: fen,
          depth: opts.depth || 12,
          multipv: opts.multipv || 1
        }, opts.timeout || 120000);
      });
    });
    queue = job.then(function () {}, function () {});
    return job;
  }

  return { init: init, analyse: analyse, info: info };
})();

// ---------- Neural-net engines ----------
// Each net runs in its own worker (ONNX, off the main thread) and is
// cached in IndexedDB after first download. Same worker protocol for both.
function makeNetEngine(workerFile, modelUrl, modelVersion) {
  var worker = null, nextId = 1, pending = {}, readyPromise = null;
  var statusCb = null, progressCb = null;

  function ensureWorker() {
    if (worker) return;
    worker = new Worker(workerFile);
    worker.onmessage = function (e) {
      var m = e.data || {};
      if (m.type === 'status') {
        if (m.status === 'no-cache') worker.postMessage({ type: 'download' });
        if (m.status === 'ready' && readyPromise && readyPromise.resolve) readyPromise.resolve();
        if (statusCb) statusCb(m.status);
      }
      if (m.type === 'progress' && progressCb) progressCb(m.progress);
      if (m.type === 'eval-result' || (m.type === 'error' && m.id !== undefined)) {
        var p = pending[m.id];
        if (!p) return;
        delete pending[m.id];
        clearTimeout(p.timer);
        if (m.type === 'eval-result') p.resolve(m); else p.reject(new Error(m.message));
      } else if (m.type === 'error') {
        if (readyPromise && readyPromise.reject) readyPromise.reject(new Error(m.message));
      }
    };
    worker.onerror = function (e) {
      var err = new Error(e.message || 'maia worker crashed');
      if (readyPromise && readyPromise.reject) readyPromise.reject(err);
      Object.keys(pending).forEach(function (id) {
        clearTimeout(pending[id].timer);
        pending[id].reject(err);
        delete pending[id];
      });
      try { worker.terminate(); } catch (ignore) {}
      worker = null;
      readyPromise = null;
    };
  }

  // init(onStatus, onProgress) resolves when the model is loaded,
  // downloading it (with progress callbacks) if it isn't cached yet.
  // Later calls refresh the callbacks; a failed init can be retried.
  function init(onStatus, onProgress) {
    if (onStatus) statusCb = onStatus;
    if (onProgress) progressCb = onProgress;
    if (readyPromise) return readyPromise.promise;
    ensureWorker();
    var box = {};
    box.promise = new Promise(function (resolve, reject) {
      box.resolve = resolve;
      box.reject = reject;
      worker.postMessage({
        type: 'init',
        modelUrl: modelUrl,
        modelVersion: modelVersion
      });
      setTimeout(function () { reject(new Error('model load timed out')); }, 300000);
    });
    box.promise = box.promise.catch(function (err) {
      readyPromise = null;   // allow a retry
      throw err;
    });
    readyPromise = box;
    return box.promise;
  }

  // evaluate(fen, eloSelf, eloOppo) -> {moves: [[uci, prob], ...] sorted, value}
  function evaluate(fen, eloSelf, eloOppo) {
    return new Promise(function (resolve, reject) {
      var id = nextId++;
      pending[id] = {
        resolve: resolve,
        reject: reject,
        timer: setTimeout(function () {
          delete pending[id];
          reject(new Error('maia eval timed out'));
        }, 30000)
      };
      worker.postMessage({ type: 'eval', id: id, fen: fen, eloSelf: eloSelf, eloOppo: eloOppo });
    });
  }

  return { init: init, evaluate: evaluate };
}

var MAIA = makeNetEngine('maia.worker.js', 'models/maia3_simplified.onnx', '3');
var ANAND = makeNetEngine('anand.worker.js', 'models/meangirl-8.onnx', '1');

function startGame(o, idx) {
  opp = o; oppIndex = idx;
  game = new Chess();
  over = false; selected = null;
  coachLeft = 3; tbLeft = 3;
  if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; }
  aiMoveSeq++;
  // Start fetching this opponent's net now (visible progress) so it's
  // ready by move one; then quietly prefetch the other net.
  var other = o.offLadder ? MAIA : ANAND;
  oppEngine().init(netLoadStatus, netLoadProgress).then(function () {
    if (game.history().length === 0 && !over) setStatus('Your move — you play White.');
    other.init(function () {}, function () {}).catch(function () {});
  }).catch(function () {});
  $('oppName').textContent = o.name;
  $('oppRt').textContent = o.rating;
  $('ladder').classList.add('hidden');
  $('gameScr').classList.remove('hidden');
  $('card').classList.add('hidden');
  rebuildPieces();
  setMarks();
  clearHints();
  renderPips();
  setStatus('Your move — you play White.');
}

function endGame() {
  over = true;
  var title, msg;
  if (game.in_checkmate()) {
    var playerWon = game.turn() === 'b';
    title = 'Checkmate';
    if (playerWon) {
      msg = 'You beat ' + opp.name + ' (' + opp.rating + ')!';
      if (opp.offLadder) {
        msg += ' Anand’s not on the ladder — bragging rights only.';
      } else if (oppIndex === progress) {
        progress++;
        msg += progress < LEVELS.length
          ? ' ' + LEVELS[progress].name + ' (' + LEVELS[progress].rating + ') is now unlocked.'
          : ' You’ve cleared the whole ladder!';
      }
    } else {
      msg = opp.name + ' beat you. Have another go.';
    }
  } else {
    title = 'Draw';
    msg = 'The game against ' + opp.name + ' ended in a draw.';
  }
  $('cardTitle').textContent = title;
  $('cardMsg').textContent = msg;
  $('card').classList.remove('hidden');
  setStatus('');
}

function toLadder() {
  if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; }
  aiMoveSeq++;
  $('gameScr').classList.add('hidden');
  $('card').classList.add('hidden');
  $('ladder').classList.remove('hidden');
  renderLadder();
}

// ---------- Wire up ----------
buildSquares();
renderThemes();
renderLadder();
var board = $('board');
board.addEventListener('pointerdown', onDown);
board.addEventListener('pointermove', onMove);
board.addEventListener('pointerup', onUp);
board.addEventListener('pointercancel', onUp);
$('back').onclick = toLadder;
$('ladderBtn').onclick = toLadder;
$('rematchBtn').onclick = function () { startGame(opp, oppIndex); };
$('coachBtn').onclick = useCoach;
$('tbBtn').onclick = useTakeback;
</script>
